packages:
  - packages/*
  - apps/*
  - test-vectors
  - e2e
  - tools

# Cooldown (minutes) before a freshly published version may be installed or locked.
# 4320 = 3 days, the same cooldown as renovate.json, so lockfile maintenance agrees with Renovate.
minimumReleaseAge: 4320

# Dependency build scripts run only for packages approved here (pnpm >= 11; replaces
# onlyBuiltDependencies, which pnpm ignores). No dependency is approved (no `true` entry), and
# strictDepBuilds makes an unapproved build fail the install instead of being skipped with a
# warning. packages/node adds `better-sqlite3: true` when it lands (M1), together with
# `rebuild: better-sqlite3` in ci.yml (docs/process/ci-cd.md).
# Explicitly denied (`false`: the script never runs and the install does not fail), for the Workers
# test-vector pool (M0-9): esbuild and workerd ship prebuilt binaries as optional platform packages
# and their postinstall scripts only verify or relink them. CI installs with --ignore-scripts, so
# the vectors job proves both work without their scripts.
allowBuilds:
  esbuild: false
  workerd: false
strictDepBuilds: true

# Removed from the dependency graph (M0-9): miniflare (under @cloudflare/vitest-plugin) depends
# on sharp only for the Images binding, which it imports lazily and which the vector harness never
# uses. sharp's prebuilt libvips packages are LGPL-3.0-or-later, which the licence policy keeps out
# of this repository (development-process.md §11).
overrides:
  sharp: '-'
