# Single source of project status (Tali, 2026-10-15).
#
# The README Status and Roadmap, the docs-site "Status and roadmap" page and (when present) the
# knowledge-base status file are GENERATED from this file. Do not edit the generated blocks
# (between `<!-- NAME:start -->` and `<!-- NAME:end -->`); edit this file and run:
#
#   node tools/docs-status/index.mjs          # regenerate
#   node tools/docs-status/index.mjs --check  # what CI runs (pnpm lint): fails on any drift
#
# A pull request that changes status (a card done, a milestone moved, a deploy, a release)
# updates this file in the same PR. Public-safe: no addresses, keys or private details.
#
# Format: a small YAML subset (maps, lists, plain or double-quoted strings, [a, b] lists of
# scalars, full-line comments), read by tools/docs-status/yaml.mjs. Pull requests are numbers
# (4thtech/agentlink) or `contracts#N` (private repo, shown without a link).

updated: "2026-10-16"
version: "v0.1.0"
versionLabel: "M1a, walking skeleton: pair and talk"
milestone: "M1a Walking skeleton: pair and talk"
phase: "M0 Foundations nearly complete; M1a (walking skeleton) released as v0.1.0 on 16 Oct 2026 (pre-alpha)"

# Components by area. state: done | in-progress | planned.
# `done` = code merged; only the released `@4thtech-io/agentlink` CLI package (v0.1.0) is published or user-runnable until a release says so.
areas:
  - id: m0
    title: "M0 Foundations"
    intro: "Repository, process and CI."
    components:
      - name: "Monorepo skeleton"
        state: done
        summary: "pnpm workspace with Turborepo, strict CI, the Foundry skeleton in the private contracts repo, architecture boundary guards and the cross-runtime test-vector harness (M0-9)."
      - name: "Delivery pipeline and runbooks"
        state: done
        summary: "The automated delivery pipeline (D-52) and the runbooks."
      - name: "Public documentation"
        state: done
        prs: [88]
        summary: "`docs-site/` (D-57), published through GitBook Git Sync, and the public knowledge base (`knowledge/` and `llms.txt`)."
      - name: "Redacting logger (@agentlink/log)"
        state: done
        summary: "Structured logging for Node, browsers and Workers that redacts secrets by field name and value shape (M0-8)."
      - name: "Specifications and process"
        state: done
        summary: "The specifications (`docs/foundation`), including decisions D-53 to D-59 (D-55: dedicated terms tools, one approval per agreement, decided 14 Oct 2026), the development and audit process and a security policy."
      - name: "Dependency updates"
        state: done
        prs: [160]
        summary: "Renovate groups all non-runtime dev tooling into one weekly pull request, so tooling updates stop rebasing each other; runtime and security-critical updates stay separate and carry a threat note."
      - name: "CI follow-ups"
        state: in-progress
        summary: "A few CI follow-ups are still open."
  - id: crypto
    title: "Crypto (@agentlink/crypto)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.0); not published as a separate package."
    components:
      - name: "Encodings, hashing, JSON canonicalisation"
        state: done
        prs: [27]
        summary: "Strict canonical encodings, SHA-256 and keccak-256, tagged hashes, RFC 8785 canonicalisation."
      - name: "Key derivation and public identities"
        state: done
        prs: [29]
        summary: "Agent keys derived from one seed; public identity bundles."
      - name: "Envelope encryption"
        state: in-progress
        prs: [38, 61]
        summary: "Content-key wrap (RFC 9180 HPKE) and payload encryption (AES-256-GCM) with key commitment are merged; the recompute vectors follow."
      - name: "EIP-712 typed data and the agent card"
        state: done
        prs: [32]
        summary: "Typed-data hashing and the signed agent card."
      - name: "EIP-712 proof types"
        state: in-progress
        prs: [221]
        summary: "Record, Receipt and Registration typed data and hashing, the recipient commitment and EIP-3009 deposit authorization typed data; the revoke struct follows."
      - name: "Owner passphrase wrap, pairing proof, safety code"
        state: done
        prs: [37]
        summary: "The owner passphrase wrap, the pairing proof and the pairing safety code."
      - name: "Key interfaces, NIP-44 v2, gift wrap"
        state: done
        prs: [41, 42, 55]
        summary: "`KeyStore`, `OwnerKeyStore`, an in-memory test store, NIP-44 v2 and gift wrap; owner-only epoch advance."
      - name: "Independent test vectors"
        state: in-progress
        prs: [25, 35, 72, 75, 104]
        summary: "Vector suites from independent generators for the merged crypto suites; the generator check covers every committed suite; more follow with each suite."
      - name: "Sender code for unknown senders"
        state: done
        prs: [110]
        summary: "The short label shown for a request from an unknown sender, from one shared helper and a vector (M1-1-sc)."
      - name: "File encryption (ALF1)"
        state: planned
        summary: "STREAM file encryption, with M1b."
  - id: types
    title: "Shared types (@agentlink/types)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.0); not published as a separate package."
    components:
      - name: "Constants and the envelope, payload, card and invite schemas"
        state: done
        prs: [23, 93]
        summary: "Merged, with per-path canonical decoders, the `encodings` vector suite and the 12 288-byte inline cap."
      - name: "Policy, approval, proof pack and tool-result types"
        state: done
        prs: [31, 36, 71, 72, 76]
        summary: "The policy document, approvals including batch approval, pairing bodies, relay lists, `contact.check` params; tested in Node, three browsers and workerd."
      - name: "Terms, TermsInput and termsHash"
        state: done
        prs: [98, 100, 101, 147]
        summary: "Merged: the strict `terms` schema with the D-74 canonical form (pinned UCD 15.0.0 characters), `TermsInput` with its JSON Schema and mapping, `termsHash` (in crypto) and the pure negotiation-chain reducer; all 381 `terms` vectors pass in Node, three browsers and workerd. The Unicode data file is vendored, with a drift check and a table-hash vector; the regenerated table equals the earlier interim one (D-77, M1-21-b)."
  - id: transport
    title: "Transport (@agentlink/transport-nostr)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.0); not published as a separate package."
    components:
      - name: "Gift wrap and unwrap"
        state: done
        prs: [45]
        summary: "Each envelope is sealed with the sender's key and wrapped once per recipient key; tested for interop with the `nostr-tools` reference."
      - name: "Relay pool and delivery outbox"
        state: done
        prs: [59]
        summary: "Publishes a wrap to its relays, counts it sent at 2 acknowledgements and retries for 24 h."
      - name: "Sync"
        state: done
        prs: [63]
        summary: "Reads each relay for new gift wraps, 48 h back from a per-relay cursor, hands each over once, and returns what it has after 3 s, flagged as partial."
      - name: "Outbox stays inside the sync look-back"
        state: done
        prs: [87]
        summary: "The outbox stops republishing outside the sync look-back (M1-5f)."
      - name: "Default relay set"
        state: done
        prs: [119]
        summary: "One shared list of four public relays (nos.lol, relay.primal.net, relay.snort.social, nostr.mom) and an opt-in script and checklist to vet them; the relays are not yet signed off."
  - id: storage
    title: "Storage (@agentlink/storage)"
    intro: "Code merged; not yet wired into the MCP tools or published as a separate package."
    components:
      - name: "Inline and S3-compatible adapters"
        state: done
        summary: "The storage adapter interface, inline files up to 12 KB inside the encrypted payload, and an S3-compatible adapter (upload, download links valid for at most 7 days, delete) that only ever receives ciphertext (M1-6a)."
      - name: "Large files, encrypted drop and storage choice"
        state: planned
        summary: "Streaming encryption with multipart upload (M1-6b), the 4thTech encrypted drop as the default (M1-6c) and integration tests against MinIO and Cloudflare R2 (M1-6a-2)."
  - id: core
    title: "Core (@agentlink/core)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.0); not published as a separate package."
    components:
      - name: "Skeleton: identity, contacts, store and approval interfaces"
        state: done
        prs: [48]
        summary: "The agent's identity and signed card, contacts (pairing commit, block, remove), an in-memory test store."
      - name: "Envelopes"
        state: done
        prs: [66]
        summary: "Building, signing and verifying envelopes in the specified order; the owner can always read; held envelopes across a contact's key rotation."
      - name: "Invites and pairing"
        state: done
        prs: [78]
        summary: "Single-use invite links, the handshake and ack with the commit-then-reveal safety code."
      - name: "Safety code checked"
        state: done
        prs: [80, 85]
        summary: "The owner's signed check, applied only when it matches the recomputed pairing and re-verified on every read; it goes through the owner-action path."
      - name: "Owner-signed actions and policies"
        state: done
        prs: [79]
        summary: "Approvals, batch approvals, cancellations and policy changes apply only with a valid owner signature, once each; a stored policy that no longer verifies makes the agent ask the owner."
      - name: "Commitments policy"
        state: done
        prs: [114]
        summary: "A binding accept, an ACCEPTED or REJECTED receipt and a firm offer wait for the owner by default; owners can allow automatic accepts for listed contacts within limits (M1-20, D-31)."
      - name: "Approval requests and the requests queue"
        state: done
        prs: [95]
        summary: "Approval requests with use-once, requests-queue limits and idempotency (M1-7e)."
      - name: "Reading an approval and counting pending ones"
        state: done
        prs: [116]
        summary: "Read one approval's state, re-verified against its stored action, and count approvals waiting for the owner (M1-7e-3)."
      - name: "Requests from unknown senders: accept, ignore, block"
        state: done
        prs: [96, 105]
        summary: "Accept, ignore, ignore all, block and unblock for requests from unknown senders, a blocked sender dropped before any decryption, refusals that expire after 7 days (M1-7e-2, D-72)."
      - name: "Held cards need the sender's own owner entry"
        state: done
        prs: [90]
        summary: "A held card is accepted only with the sender's own owner entry (G-51)."
      - name: "Send pipeline"
        state: done
        prs: [99, 133]
        summary: "Sending a message to a paired contact, stored with its delivery rows before anything is published, retried from the outbox, with one publisher per row when several processes share the agent (M1-7k). Stale staged pairing messages are bounded at 24 h, and a publisher lease keeps one process per agent on the relay connections (M1-7k-b)."
      - name: "Inbox sync, delivery acknowledgements, owner card update"
        state: done
        prs: [106, 130, 131]
        summary: "Inbox sync with a per-contact rate limit, opt-in delivery acknowledgements and a fetch-only catch-up for read-only status (M1-7h). The inbox page read marks items read, and the unread counts match what the page can return (M1-7h-c, M1-9p-b). Owner-signed revocations of contacts and of the agent itself are applied; the owner card update (M1-7j, M1b) follows."
      - name: "Terms and one approval per agreement"
        state: done
        prs: [126, 134]
        summary: "Offers, counters, rejects and accepts with the chain fields filled from the agent's own store; the negotiation rules (no forks, lock after an accept, conflicts and anchored resends) applied on receive; an accept asks the owner once per agreement, or runs within the owner-signed auto-accept limits, and is sent at most once (M1-32, D-55). Repeats under one clientRequestId send nothing, and revisions that arrive out of order are applied in link order (M1-32-b). Receipts and recorded offers follow in M1b."
  - id: node
    title: "Node runtime (@agentlink/node)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.0); not published as a separate package."
    components:
      - name: "Agent key store in the OS keychain"
        state: done
        prs: [54, 57, 83]
        summary: "macOS Keychain, Windows Credential Manager, Linux Secret Service, with the \"needs setup\" answer on machines without one; CI runs on all three."
      - name: "Local SQLite database"
        state: done
        prs: [60, 68]
        summary: "Sensitive columns encrypted under a key from the keychain, shared safely by several processes."
      - name: "Owner code at a prompt"
        state: done
        prs: [67]
        summary: "The owner's key store unlocked with the owner code or passphrase; batch approval."
      - name: "Relay connection"
        state: done
        prs: [81, 84]
        summary: "Connects only to an address that passed the relay address check, refuses redirects and proxies, caps incoming messages; a Docker relay suite runs in CI."
      - name: "Policy version record in the keychain"
        state: done
        prs: [86]
        summary: "Stops an older owner-signed policy from being put back."
      - name: "First agent card at owner setup"
        state: done
        prs: [118]
        summary: "`owner init` signs the agent's first card in the same owner step, so a new agent can pair; the owner key signs only the agent card and the defined owner decisions (M1-8h)."
      - name: "Passphrase-locked key file for headless machines"
        state: planned
        summary: "M1-8f."
  - id: apps
    title: "MCP server, CLI and apps"
    intro: "The CLI runtime, its everyday and owner commands, the MCP server with its tools and its background loop, and the agent skill file and quickstart guides have landed. v0.1.0 was released on npm on 16 Oct 2026 as `@4thtech-io/agentlink`; a new user installs it with `npx -y @4thtech-io/agentlink init`."
    components:
      - name: "MCP server and CLI"
        state: in-progress
        prs: [102, 103, 107, 111, 112, 113, 115, 124, 125, 127, 131, 132, 135, 142, 143, 178, 183, 184, 185, 186, 190, 192, 193]
        summary: "`npx` package with the MCP server over stdio and the `agentlink` CLI (M1a). The CLI runtime (opening an agent, the M1a approval channel, the command dispatcher, terminal output sanitising), `init`, `invite`, `accept`, `contacts`, `status`, `doctor`, `requests` and the owner commands (`owner init`, `approve` for one request or a list, `deny`, `cancel`) have landed, with the in-chat copy sheet. The MCP server over stdio (the frozen M1a tool list, the untrusted-content wrapper) and its tools have landed: status, contacts, get approval (real approval data, with the sender code of an unknown sender), invite, accept, send, inbox and the terms tools (propose, respond, and the owner's terms approval card in `approve`). A conformance and tool-surface guard test pins the tool list. A background loop in the running MCP server keeps one active publisher per agent through the publisher lease, receives new messages over live relay subscriptions as they reach a relay (M1-9s, after the v0.1.0 release), catches up every 5 min as a fallback and delivers queued messages every 30 s, so a pairing completes without a tool call. Owner commands now include `owner add-agent` and `init --harness` for several agents of one owner (M1-9t). v0.1.0 was released on 16 Oct 2026: `@4thtech-io/agentlink` on npm (`latest`), one bundled file with the libraries built in, published from CI with provenance (OPS-REL-1; release checklist `docs/runbooks/release-v0.1.0.md`)."
      - name: "Agent skill file and quickstart guides"
        state: done
        prs: [151, 152]
        summary: "The agent skill file and AGENTS.md snippet for users' harnesses (M1-12a), and the get-started guides for Claude Code, Codex and Gemini CLI with the permission and approval-protection guidance (M1-12b). They describe the M1a install of the released v0.1.0."
      - name: "End-to-end tests"
        state: in-progress
        prs: [155, 163, 165, 166, 169, 171]
        summary: "A scripted run drives two real `agentlink mcp` processes, pairing and messaging over local relays in CI (M1-13a), and a second scenario has two agents negotiate terms over Talk with one owner approval (propose, counter, accept, the owner-signed auto-accept limit; M1-22). A variant with Claude Code and Codex as the two agents runs by manual dispatch only, with no schedule yet; its first runs found and fixed wording and approval-reuse gaps in `accept_invite` and the status summary. The negotiation steps of the live-agent variant have not run yet. Files, proof and agreements with proof follow (M1-13c)."
      - name: "Multi-harness dogfood runbook"
        state: done
        prs: [168]
        summary: "A numbered guide for the M1a dogfood across Claude Code, Antigravity and OpenCode, on one or two computers and between Tali and Denis (M1-23, RB-17). Tali ran the automated local dogfood twice (M1-23, #181, #187, #188) and fixed what it found; the two-person dogfood against the published package is still to run."
      - name: "Several agents of one owner on one computer"
        state: done
        prs: [172, 178]
        summary: "One owner key shared by several local agents, each on its own harness: `owner add-agent` and `init --harness` (M1-9t, D-78). Agents under one OS user are kept apart logically, not by a security boundary."
      - name: "Local approval page"
        state: planned
        summary: "A small page on localhost for owner approvals and settings (M1b)."
      - name: "Owner console, desktop apps, cloud agent"
        state: planned
        summary: "M2."
  - id: contracts
    title: "OCC v2 contracts (private repo)"
    intro: "Pre-audit. Nothing in AgentLink uses them yet."
    components:
      - name: "Notary and fee vault"
        state: done
        prs: ["contracts#4"]
        summary: "Developed in the private contracts repo; their test and static-analysis review continues."
      - name: "Testnet deployment"
        state: done
        prs: [65, "contracts#8", "contracts#9"]
        summary: "Deployed on the Base Sepolia testnet; a live smoke test passed on 14 Oct 2026."
      - name: "Gnosis Chiado deployment, ABI package, pre-audit fixes"
        state: planned
        summary: "Follow-ups for M1b; mainnet follows the external audit (M3)."
  - id: design
    title: "Design"
    intro: "Tracked in `docs/design/`."
    components:
      - name: "Design drop D1"
        state: done
        prs: [33]
        summary: "Brand core, tokens, components and the local approvals screens."
      - name: "Design drop D2"
        state: in-progress
        prs: [82]
        summary: "Console, desktop apps, onboarding and more; partly in."

