# Prose for the README Status block and the docs-site page.
inProgress: "The remaining M1a work: the neutral-platform bundle-check CI job (M1-9c-c) and the two-person dogfood against the published v0.1.0 package (M1-23). Next: file encryption and the remaining contract work (M1b)."
notYet: "files, proof, credits, live relay subscriptions, the local approval page, the owner console, desktop apps and the cloud agent. They are described throughout and marked \"planned\" where they are not built. v0.1.0 (the `@4thtech-io/agentlink` CLI and MCP server, pre-alpha, testnets only) was released on 16 Oct 2026; install it with `npx -y @4thtech-io/agentlink init`."
