  - id: apps
    title: "MCP server, CLI and apps"
    intro: "The CLI runtime, its everyday and owner commands, the MCP server with its tools and its background loop, and the agent skill file and quickstart guides have landed. v0.1.0 was released on npm on 16 Oct 2026, v0.1.1 on 18 Oct 2026 and v0.1.2 on 20 Oct 2026 as `@4thtech-io/agentlink`; a new user installs it with `npx -y @4thtech-io/agentlink init`."
    components:
      - name: "MCP server and CLI"
        state: in-progress
        prs: [102, 103, 107, 111, 112, 113, 115, 124, 125, 127, 131, 132, 135, 142, 143, 178, 183, 184, 185, 186, 190, 192, 193, 199, 200, 201, 205, 206, 219, 231, 235, 238]
        summary: "`npx` package with the MCP server over stdio and the `agentlink` CLI (M1a). The CLI runtime (opening an agent, the M1a approval channel, the command dispatcher, terminal output sanitising), `init`, `invite`, `accept`, `contacts`, `status`, `doctor`, `requests` and the owner commands (`owner init`, `approve` for one request or a list, `deny`, `cancel`) have landed, with the in-chat copy sheet. The MCP server over stdio (the frozen M1a tool list, the untrusted-content wrapper) and its tools have landed: status, contacts, get approval (real approval data, with the sender code of an unknown sender), invite, accept, send, inbox and the terms tools (propose, respond, and the owner's terms approval card in `approve`). A conformance and tool-surface guard test pins the tool list. A background loop in the running MCP server keeps one active publisher per agent through the publisher lease, receives new messages over live relay subscriptions as they reach a relay (M1-9s, after the v0.1.0 release), catches up every 5 min as a fallback and delivers queued messages every 30 s, so a pairing completes without a tool call. Owner commands now include `owner add-agent` and `init --harness` for several agents of one owner (M1-9t). v0.1.0 was released on 16 Oct 2026 and v0.1.1 on 18 Oct 2026: `@4thtech-io/agentlink` on npm (`latest` is 0.1.2), one bundled file with the libraries built in, published from CI with provenance (OPS-REL-1; release steps `docs/runbooks/merge-and-release.md`). New in v0.1.1: live relay subscriptions in the background loop (M1-9s, with the 5-minute catch-up kept as a fallback), `init --harness claude-desktop` and Gemini CLI detection by its binary or settings file (M1-9w), `status` and `doctor` naming a missing owner card (M1-9u), owner recovery with no attached agent (M1-9x), the terms tools passing `clientRequestId` and a fixed approval clock (M1-32-c, M1-32-d), contact names instead of raw addresses in summaries (M1-22-b), a clear message when Node.js is older than 22.14 and quieter one-shot commands (M1-9y), `owner change-code` to replace an exposed owner code without changing the owner (M1-9z), the invite approval naming who is inviting with their owner fingerprint (M1-9zb), and the owner commands `contacts rename` and `contacts remove` (M1-9za). Released in 0.1.2: the file tools (M1-9d-1): `agentlink_send` attaches a file from a folder the owner allows (checked with realpath, never opened when refused) and `agentlink_fetch_file` saves a received file into the inbox folder after both checks; `agentlink_status` shows where larger files go. Owners can allow a folder for sending with `agentlink policy allow-folder` (owner code, never from the AI tool; M1-9m), in 0.1.2, with a protected-root refusal and `policy recover` (M1-9m-b). Files above about 12 KB need the encrypted drop, which went live on 19 Oct 2026; sending through it from the tools follows (M1-13c)."
      - name: "Agent skill file and quickstart guides"
        state: done
        prs: [151, 152]
        summary: "The agent skill file and AGENTS.md snippet for users' harnesses (M1-12a), and the get-started guides for Claude Code, Codex and Gemini CLI with the permission and approval-protection guidance (M1-12b). They describe the M1a install of the released v0.1.0."
      - name: "End-to-end tests"
        state: in-progress
        prs: [155, 163, 165, 166, 169, 171, 232, 242]
        summary: "The deterministic end-to-end run is part of the merge gate (OPS-CI-6). A scripted run drives two real `agentlink mcp` processes, pairing and messaging over local relays in CI (M1-13a), and a second scenario has two agents negotiate terms over Talk with one owner approval (propose, counter, accept, the owner-signed auto-accept limit; M1-22). A variant with Claude Code and Codex as the two agents runs by manual dispatch only; its first runs found and fixed wording and approval-reuse gaps in `accept_invite` and the status summary. The negotiation steps of the live-agent variant have not run yet. Files, proof and agreements with proof follow (M1-13c)."
      - name: "Multi-harness dogfood runbook"
        state: done
        prs: [168, 202, 236, 239, 241, 242]
        summary: "A two-machine dogfood mode and runbook, a dogfood script that reports tool error codes and a hands-free two-Mac mode (M1-23-b, M1-23-c, M1-23-d, M1-23-e). A numbered guide for the M1a dogfood across Claude Code, Antigravity and OpenCode, on one or two computers and between Tali and Denis (M1-23, RB-17). Tali ran the automated local dogfood twice (M1-23, #181, #187, #188) and fixed what it found; the two-machine M1 gate run passed 17 of 17 checks for the pairing, messaging, injection-resistance and terms journeys (J1, J4, J8, J9); the journeys that need files, proof and credits (J2, J3, J5) wait for the M1b features. A nightly two-machine test on a Mac and a Linux runner is live and green (OPS-CI-7). The two-person dogfood between Tali and Denis is still to run."
      - name: "Several agents of one owner on one computer"
        state: done
        prs: [172, 178]
        summary: "One owner key shared by several local agents, each on its own harness: `owner add-agent` and `init --harness` (M1-9t, D-78). Agents under one OS user are kept apart logically, not by a security boundary."
      - name: "Local approval page"
        state: in-progress
        prs: [207, 225, 247, 256, 267]
        summary: "The localhost server behind it is merged (see the Node runtime), with a functional, unstyled page: first run with a localhost passkey (M1-8e), approval cards with who, what, cost and the rule, and review together, where one passkey gesture or owner code entry confirms exactly the listed approvals while terms stay single (M1-11a). Session links open once and repeated wrong owner codes make you wait. When your AI needs an approval, `agentlink mcp` opens the page in your browser and the AI shows you its link, next to the `agentlink approve` command (M1-11a-b). The design (M1-11b), \"Remember for this contact\" and `agentlink ui` are still to build (M1b)."
      - name: "Beginner setup page"
        state: done
        prs: [234]
        summary: "A docs-site page that walks a new user through adding AgentLink to their AI tool (DOCS-SETUP)."
      - name: "Submitter and test-credits faucet"
        state: done
        prs: [293, 298, 327, 330, 332, 338, 342, 349, 372]
        summary: "The submitter Worker records signed proofs on the agent's behalf, resubmits items apart after a shared failure and repairs nonce gaps (M1-10a, M1-10a-b). It is live in production at submit.agentlink.4thtech.io (21 Oct 2026, the testnet beta: Base Sepolia, health ok), deployed through its CI pipeline with owner approval: staging, a smoke test that sends nothing, production with automatic rollback and the deploy freeze (M1-10c). Proofs work end to end on the testnet. Its first deploy found and fixed two Worker-only bugs (RPC requests and the unknown-record answer, #332, #338). It holds a test-credits faucet limited to one claim per agent per day with per-IP and global caps (M1-10b); the faucet charges before it sends and retries a lost answer safely (M1-10b-b, #349). A new claim waits while an earlier faucet payout is still pending, and every payout has a fee cap (M1-10b-c, #372). The Worker keeps no logs: every deploy fails if log streaming or export is on (OPS-PRIV-1). No npm release names the submitter yet; the next release brings the tool changes that use it with no further setup."
      - name: "Owner console, desktop apps, cloud agent"
        state: planned
        summary: "M2."
      - name: "Adding credits: pay page"
        state: planned
        summary: "Direction set (D-111): one link from the agent opens a separate pay page where credits are added in dollars, crypto first: use crypto you already have (connect your own account, M2-18b) or send from an exchange to the agent's address with a QR code (M2-18c), plus free test credits on testnets. The agent explains the one step, watches for the funds and confirms the credits; users pay every cost. Pay by card comes last, after the legal entity is decided (M2-18a, M3-4c). Decided 21 Oct 2026: messages and files stay free (D-112), the top-up link carries everything after the `#` so it never reaches a server log (D-113), and the sender's proof fee covers up to 3 receipts (D-114). The link in the tools (M1-26-e) is in review and stays off until the pay page exists."
      - name: "Encrypted drop service"
        state: in-progress
        summary: "The 4thTech drop Worker (signed uploads with no accounts, single-use upload targets, a hash-checked commit, signed downloads until expiry, quotas and rate limits, no logs, M1-27a) is deployed: staging, and production at drop.agentlink.4thtech.io since 19 Oct 2026, through its deploy pipeline (staging, smoke test, production with automatic rollback, M1-27b). The first production deploy is healthy; its pipeline now waits for a new domain's certificate and reports a rollback that Cloudflare refuses across a storage change (M1-27b-c). Sending files through it from the CLI and the MCP tools (M1-13c) follows."
  - id: contracts
    title: "OCC v2 contracts (private repo)"
    intro: "Pre-audit, testnets only. The live proof submitter records on Base Sepolia."
    components:
      - name: "Notary and fee vault"
        state: done
        prs: ["contracts#4"]
        summary: "Developed in the private contracts repo; their test and static-analysis review continues."
      - name: "Testnet deployment"
        state: done
        prs: [65, "contracts#8", "contracts#9"]
        summary: "Deployed on the Base Sepolia testnet; a live smoke test passed on 14 Oct 2026."
      - name: "ABI package"
        state: done
        prs: [273, "contracts#19"]
        summary: "The contracts release v0.1.0-testnet.3 exports the interface ABIs, the Base Sepolia and Gnosis Chiado addresses and a SHA-256 manifest, with no Solidity source. The private in-repo package `@4thtech-io/occ-v2-abi` imports it, CI checks every file against the manifest, and client code gets ABIs without admin, upgrade or module functions (M1-3f, D-83)."
      - name: "Gnosis Chiado deployment"
        state: done
        prs: [373, "contracts#24"]
        summary: "Deployed on the Gnosis Chiado testnet on 19 Oct 2026 at the same addresses as Base Sepolia; the live smoke test passed on 21 Oct 2026. The submitter and the test-credits faucet serve Chiado, and it joins automatic network selection once deployed: the submitter after its next deploy, the CLI and tools from the next npm release (M1-3j-b, M1-3j-c)."
      - name: "Pre-audit fixes"
        state: planned
        summary: "Follow-ups for M1b; mainnet follows the external audit (M3)."
  - id: design
    title: "Design"
    intro: "Tracked in `docs/design/`."
    components:
      - name: "Design drop D1"
        state: done
        prs: [33]
        summary: "Brand core, tokens, components and the local approvals screens. In docs/design since 14 Oct 2026; it needs adjustment before the UI is built (D-116)."
      - name: "Design drop D2"
        state: in-progress
        prs: [82]
        summary: "Console, desktop apps, onboarding and more; a first pass is in docs/design (14 Oct 2026) and needs adjustment (D-116)."
  - id: privacy
    title: "Privacy of proofs (D-109)"
    intro: "Specified on 20 Oct 2026 (D-109). A proof never shows content, but it does show publicly which agent recorded it, when and what kind, and a receipt shows who received it. These items limit that. The M1b items (receipts off by default, the plain disclosure, the record linking rule) are merged for the next release; the M2 items are not built."
    components:
      - name: "Delivery receipts off by default"
        state: done
        prs: [325, 333]
        summary: "Merged for the next release (after 0.1.2) (M1-33a, M1-33d): a delivery receipt is signed only when the recipient's rules allow it for that contact or the recipient says yes to the sender's request, since it shows publicly who received a proof."
      - name: "Plain-language disclosure"
        state: done
        prs: [328]
        summary: "Merged for the next release (after 0.1.2) (M1-33b): the agent says, before the first proof of a session and on every approval that adds one, that anyone can see that the agent recorded something, when and what kind, and never what it says. Receipts, the proof file and adding credits carry the same words, and the user guide quotes them."
      - name: "Record linking rule"
        state: done
        prs: [323]
        summary: "Merged for the next release (after 0.1.2) (M1-33c): a proof links only to the same agent's earlier proof, never to the other side's, so no link between two agents is published without a receipt."
      - name: "Per-relationship signing addresses"
        state: planned
        summary: "M2 (M2-17a): a separate, unlinkable signing address for each contact, so one agent does not collect a public log of all its proofs."
      - name: "Registry privacy"
        state: planned
        summary: "M2 (M2-17b): registration stays optional and publishes no guessable name or other identifier."
      - name: "Delayed or batched receipts"
        state: planned
        summary: "M2 (M2-17c): optional random delay and batching, so receipt times do not show when an agent was online."
      - name: "Service logging off"
        state: in-progress
        prs: [331, 334, 335]
        summary: "The proof submitter, the testnet faucet and the encrypted drop keep no logs: every deploy fails if platform logging, log streaming or trace export is switched on, and a test checks that the relay never logs an IP, address, record ID, salt, signature or transaction hash (OPS-PRIV-1). The owner's runbook lists the account-level settings to check."

# The deploy state of the OCC v2 contracts and services. No addresses here (public-safe).
deploy:
  testnet:
    state: deployed
    network: "Base Sepolia"
    note: "OCC v2 notary and fee vault deployed and smoke-tested on 14 Oct 2026. Pre-audit. The live submitter records proofs here (21 Oct 2026). Gnosis Chiado is deployed and smoke-tested (21 Oct 2026) and is chosen automatically once deployed (M1-3j-c)."
  mainnet:
    state: planned
    note: "After the external audit (M3). Not deployed."
  services:
    state: deployed
    note: "The encrypted drop Worker is deployed to production at drop.agentlink.4thtech.io (19 Oct 2026, first production deploy; health check passing: /v1/health answers 200 and an unsigned upload 401), through its CI pipeline (M1-27b). No released CLI version uses it yet. The submitter Worker is deployed to production at submit.agentlink.4thtech.io (21 Oct 2026, the testnet beta on Base Sepolia, health ok) through its CI pipeline with owner approval (M1-10c); proofs work end to end on the testnet."

# Prose for the README Status block and the docs-site page.
inProgress: "M1b is in progress. v0.1.2 (20 Oct 2026) is on npm `latest`: it adds sending and saving files from allowed folders, adding proof to messages, checking a proof file (`agentlink verify`), credits, the approval page that opens when your AI needs you, and `agentlink policy`. The submitter, which records signed proofs on the agent's behalf, went live on 21 Oct 2026 at submit.agentlink.4thtech.io on a testnet, and proofs work end to end there. The Gnosis Chiado contracts passed their live smoke test the same day; Chiado is chosen automatically once deployed (the submitter after its next deploy, the tools from the next release). The encrypted drop is live (19 Oct 2026). Merged on main for the next release, not in v0.1.2: a check that an accepted invite pairs with the agent it names, a notice when a sync may be incomplete, delivery receipts off by default with receipt requests, receipts paid for by the sender's proof fee (the recipient needs no credits, and a receipt the submitter cannot take yet is sent on a later sync), the plain notices on what a proof makes public, a flag on a contact whose proof does not match the chain, deleting a sent file once the receipt arrives, paid tools choosing the funded network on their own, firm offers and recorded accepts with proof under one approval on the terms tools, and the testnet faucet hardening: a new claim waits while an earlier faucet payout is still pending, and payouts have a fee cap. Still open from M1a: the two-person dogfood between Tali and Denis (M1-23). Next in M1b: the designed approval page, sending files through the drop from the tools, adding credits through a pay page, and the 0.2.0 release."
notYet: "the designed local approval page (a functional page with the owner code and a localhost passkey is merged, and `agentlink mcp` opens it when an approval is needed), the pay page for adding credits (the top-up link is built but off until it exists), the owner console, desktop apps and the cloud agent. They are described throughout and marked \"planned\" or \"in development\" where they are not available. Proof works on testnets only. v0.1.2 (the `@4thtech-io/agentlink` CLI and MCP server, pre-alpha) was released on 20 Oct 2026 and is the npm `latest`; install it with `npx -y @4thtech-io/agentlink init`."
next: "Send files through the encrypted drop from the tools (M1-13c), add `agentlink ui`, run the two-person dogfood, then finish M1b: the pay page for credits, the designed approval page and the 0.2.0 release."

# Milestones. state: done | in-progress | planned. `gate` is the README wording, `outcome` the
# docs-site wording, `progress` an optional README note on what is done so far.
roadmap:
  - id: "M0"
    name: "Foundations"
    state: in-progress
    stateNote: "nearly complete"
    version: "0.0.x"
    duration: "~1 week"
    outcome: "Repository, CI and rules in place"
    gate: "Specs, repositories, CI and open decisions in place."
    progress: "Done so far: monorepo skeleton, Foundry skeleton in the private contracts repo, boundary guards, test-vector harness, redacting logger, delivery pipeline, runbooks, public docs structure and specs D-53 to D-59. Still open: a few CI follow-ups."
  - id: "M1a"
    name: "Walking skeleton: pair and talk"
    state: in-progress
    stateNote: "v0.1.0 released 16 Oct 2026, v0.1.1 on 18 Oct, v0.1.2 on 20 Oct 2026; two-person dogfood open"
    version: "0.1.0"
    duration: "~2–3 weeks"
    outcome: "Two agents on different harnesses pair and talk; negotiate terms over Talk; owner approvals"
    gate: "Two developers' agents (Claude Code and Codex) pair and keep a shared project in sync over AgentLink, and negotiate terms with owner approval."
    progress: "Crypto foundations, the transport (gift wrap, relays, sync), the core (envelopes, pairing, owner-signed actions and policies, approvals, requests from unknown senders, the send pipeline, inbox sync, the commitments policy), the terms schema, the node keychain, database and relay connection, the CLI runtime with its everyday and owner commands, the default relay set, the MCP server with its tools (read-only, invite, send, inbox, terms) and its background loop, the agent skill file and quickstart guides, the two-agent end-to-end tests (pair and talk, and negotiate terms; the Claude Code and Codex variant by manual dispatch), and the dogfood runbook are merged. Several agents of one owner on one computer (M1-9t) and the automated local dogfood are merged too. v0.1.0 was released on npm on 16 Oct 2026 as `@4thtech-io/agentlink` and v0.1.1 followed on 18 Oct 2026. The two-machine M1 gate run passed 17 of 17 checks for the pairing, messaging, injection-resistance and terms journeys (J1, J4, J8, J9); the two-person dogfood between Tali and Denis is still to run."
  - id: "M1b"
    name: "Files, proof, credits"
    state: in-progress
    stateNote: "started; file and proof tools in v0.1.2, submitter live on a testnet"
    version: "0.2.0 (M1 gate)"
    duration: "~3–4 weeks"
    outcome: "Send files with no setup; notarize on testnets with free test credits; export and verify proof packs; local approval UI; delivery receipts off by default and plain privacy disclosure for proofs (D-109)"
    gate: "10 internal testers on at least 3 harness combinations complete setup, first message, a file handover with proof, an owner approval, a third-party verification and a proof of agreement (completes M1, testnets)."
    progress: "Released in v0.1.1 as part of M1a hardening: live relay subscriptions, the claude-desktop setup option and Gemini CLI detection, clearer status and recovery messages, `owner change-code`, contact rename and remove, the invite approval naming who is inviting, and the Node.js 22.14 check. Released in v0.1.2: the file and proof tools (M1-9d-1, M1-9d-2), `agentlink policy allow-folder` and `policy recover` (M1-9m, M1-9m-b), the localhost approval page, STREAM file encryption and file send and fetch in the core. Merged but not yet reachable from the tools: multipart upload with streaming encryption for your own storage, the Revocation typed data, and the passkey and recovery-code backup formats. The encrypted drop Worker is deployed to production (19 Oct 2026) and the proof submitter is live on a testnet (21 Oct 2026). Merged after v0.1.2, for the next release: delivery receipts off by default with receipt requests, privacy notices for proofs, proof-mismatch flags, delete on receipt, and automatic network choice in the paid tools. The two-machine M1 gate run passed 17 of 17 for J1, J4, J8 and J9; J2, J3 and J5 wait for the M1b features. Not started or not merged: the designed approval page, the pay page for credits and sending files through the drop from the tools."
  - id: "M2"
    name: "Owner console, desktop apps, self-host, design"
    state: planned
    version: "0.3.0"
    duration: "~4–6+ weeks"
    outcome: "Owner console; desktop apps for macOS, Windows and Linux; self-hosted cloud agent; verify and invite pages; accept in the browser; verified registration and domains; storage connectors; proof privacy: per-relationship signing addresses, private registry, optional delayed receipts (D-109)"
    gate: "20 to 50 external early adopters on testnets; install to first message in under 5 minutes."
  - id: "M3"
    name: "Mainnet beta (Base, Gnosis)"
    state: planned
    version: "1.0.0"
    duration: "~4 weeks"
    outcome: "External audit; contracts on Base and Gnosis; paid proof with credits"
    gate: "External audit findings (high and medium) fixed; first paid proofs with zero security incidents."
  - id: "M4"
    name: "Expansion"
    state: planned
    version: "after 1.0.0"
    duration: "rolling"
    outcome: "More chains; batched receipts; hosted remote MCP in approval mode (after design review); more adapters"
    gate: "Rolling, no single gate yet: more proof networks, batched receipts, hosted approval-mode MCP, more adapters."
  - id: "M5"
    name: "Agent commerce"
    state: planned
    version: "after 1.0.0"
    duration: "rolling"
    outcome: "Deal records, payment linkage, arbitrator disclosure"
    gate: "Rolling, no single gate yet: deal records, x402 settlement linkage, arbitrator disclosure."
  - id: "M6"
    name: "Solana"
    state: planned
    version: "after M4"
    duration: "rolling"
    outcome: "Planned, no dates: after the EVM chains are covered, AgentLink on Solana, with programs equivalent to the notary and fee vault and client support (D-110); starts with a design spike"
    gate: "Planned, no single gate yet: a design spike accepted by the owner (M6-1), then audited programs and client support; users still never pick a chain."
