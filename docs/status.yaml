        summary: "The storage adapter interface, inline files up to 12 KB inside the encrypted payload, and an S3-compatible adapter (upload, download links valid for at most 7 days, delete) that only ever receives ciphertext (M1-6a)."
      - name: "Multipart upload, cleanup and streaming"
        state: in-progress
        prs: [254, 260]
        summary: "Large files upload to your own S3-compatible storage in parts and are encrypted on the fly as they upload and decrypted as they download, with a quarantine step before a streamed download is released (D-84); an interrupted upload is always cancelled and leftovers can be cleaned up (M1-6b). Tested against MinIO on every pull request and Cloudflare R2 every day (M1-6a-2). In development: no tool uses it yet."
      - name: "Encrypted drop as the default and storage choice"
        state: done
        prs: [268, 313, 339]
        summary: "The 4thTech encrypted drop as the default storage and the choice between it and your own storage (M1-6c). Merged for the next release (0.1.2): a file in the drop can still be deleted after the agent's keys rotate, because the key generation it was uploaded under is kept with it (M1-1g-g, D-108). With delete after receipt turned on, the agent deletes a sent file from storage once the contact's delivery receipt is on record, also after a key change (M1-1g-h)."
  - id: chain
    title: "Chain client (@4thtech-io/chain)"
    intro: "In development; not wired into the MCP tools yet."
    components:
      - name: "Chain client foundation"
        state: done
        prs: [276]
        summary: "The client knows Base Sepolia from the shipped entry and the pinned contracts release and picks the chain on its own. It reads through several public endpoints with timeouts, retries and failover. Endpoint addresses are treated as secrets and never logged or returned; private and loopback addresses are refused at resolve time. It can only form client calls, and it builds proof records and receipts that match the shared test vectors, each record with a fresh random salt and nonce (M1-4a)."
      - name: "Fee quotes, credits and top-ups"
        state: done
        prs: [279]
        summary: "The client quotes a proof or a registration from the fee vault itself and shows it in USD, with the AgentLink fee and any app fee separate; reads the agent's prepaid credits on every supported chain; and prepares a direct top-up. Only stablecoin fee tokens are priced or shown, and credit history counts only real events from the fee vault. No endpoint address can be read from the client object, and a client is built only over the address-checked fetch (M1-4b). Submission and proof checks follow (M1-4c, M1-4d)."
      - name: "Automatic chain selection"
        state: done
        prs: [284, 312]
        summary: "Released in 0.1.2. The client checks the agent's credits on every supported network at once and picks where a proof is paid with no question to the user: the default network when it has enough credits, otherwise the cheapest one that does, otherwise a \"credits needed\" answer naming where to add them and how much is missing. A network that does not answer in time is skipped, never chosen, and only test networks are used in this release (M1-26). Released in 0.1.2 (not in v0.1.1): no default CLI or tool output names a network; it appears only under Advanced (M1-26-b, D-108). The paid tools choosing the network on their own follows (M1-26-c)."
      - name: "Proof submission and deposits"
        state: done
        prs: [295]
        summary: "Merged, not user-facing yet. The client sends signed proofs through a list of submitters with failover, or directly from the agent's own account when no submitter gets them on-chain, and always reads the result from the chain rather than trusting a submitter's answer. It can also add credits for the agent (reading the current allowance first) and then selects the network again from fresh reads (M1-4c). Wiring into the CLI and MCP tools follows (M1-26-b)."
      - name: "Proof verification and who sent a message"
        state: done
        prs: [290, 297, 314]
        summary: "Merged, not user-facing yet. Checking a proof pack confirms the record on the chain and, when the agent profile carries the agent's own signatures over it, who sent the message; without them the proof shows the record but not the sender, and a forged signature makes the proof fail (M1-4d-b, M1-4d-d). Released in 0.1.2 (not in v0.1.1): `agentlink verify` checks a proof pack from the proofs or inbox folder and ends with an exit code scripts can read, and `agentlink credits` shows the agent's credits (M1-9h, D-108)."
  - id: core
    title: "Core (@4thtech-io/core)"
    intro: "Code merged. Built into the released `@4thtech-io/agentlink` CLI (v0.1.2); not published as a separate package."
    components:
      - name: "Skeleton: identity, contacts, store and approval interfaces"
        state: done
        prs: [48]
        summary: "The agent's identity and signed card, contacts (pairing commit, block, remove), an in-memory test store."
      - name: "Envelopes"
        state: done
        prs: [66]
        summary: "Building, signing and verifying envelopes in the specified order; the owner can always read; held envelopes across a contact's key rotation."
      - name: "Invites and pairing"
        state: done
        prs: [78, 353]
        summary: "Single-use invite links, the handshake and ack with the commit-then-reveal safety code. Accepting an invite is refused unless the agent it pairs with is the one the invite names (M1-9ze)."
      - name: "Safety code checked"
        state: done
        prs: [80, 85]
        summary: "The owner's signed check, applied only when it matches the recomputed pairing and re-verified on every read; it goes through the owner-action path."
      - name: "Owner-signed actions and policies"
        state: done
        prs: [79]
        summary: "Approvals, batch approvals, cancellations and policy changes apply only with a valid owner signature, once each; a stored policy that no longer verifies makes the agent ask the owner."
      - name: "Commitments policy"
        state: done
        prs: [114]
        summary: "A binding accept, an ACCEPTED or REJECTED receipt and a firm offer wait for the owner by default; owners can allow automatic accepts for listed contacts within limits (M1-20, D-31)."
      - name: "Approval requests and the requests queue"
        state: done
        prs: [95]
        summary: "Approval requests with use-once, requests-queue limits and idempotency (M1-7e)."
      - name: "Reading an approval and counting pending ones"
        state: done
        prs: [116]
        summary: "Read one approval's state, re-verified against its stored action, and count approvals waiting for the owner (M1-7e-3)."
      - name: "Requests from unknown senders: accept, ignore, block"
        state: done
        prs: [96, 105]
        summary: "Accept, ignore, ignore all, block and unblock for requests from unknown senders, a blocked sender dropped before any decryption, refusals that expire after 7 days (M1-7e-2, D-72)."
      - name: "Held cards need the sender's own owner entry"
        state: done
        prs: [90]
        summary: "A held card is accepted only with the sender's own owner entry (G-51)."
      - name: "Send pipeline"
        state: done
        prs: [99, 133]
        summary: "Sending a message to a paired contact, stored with its delivery rows before anything is published, retried from the outbox, with one publisher per row when several processes share the agent (M1-7k). Stale staged pairing messages are bounded at 24 h, and a publisher lease keeps one process per agent on the relay connections (M1-7k-b)."
      - name: "Inbox sync, delivery acknowledgements, owner card update"
        state: done
        prs: [106, 130, 131, 366]
        summary: "Inbox sync with a per-contact rate limit, opt-in delivery acknowledgements and a fetch-only catch-up for read-only status (M1-7h). The inbox page read marks items read, and the unread counts match what the page can return (M1-7h-c, M1-9p-b). Owner-signed revocations of contacts and of the agent itself are applied; a contact's revocation also voids pending approvals and open commitment parts with that contact, and delivery acknowledgements are queued for the delivery pass instead of sent during a sync (M1-7h-b). When a relay returns its maximum number of messages and the inbox may be incomplete, `status` and the inbox say so in one fixed line (M1-5g). The owner card update (M1-7j, M1b) follows."
      - name: "Live relay subscriptions"
        state: done
        prs: [204]
        summary: "The running MCP server receives new messages from a relay as they arrive instead of waiting for the next catch-up (M1-9s). Released in v0.1.1."
      - name: "Policy rules for files, proofs and the budget ledger"
        state: done
        prs: [217]
        summary: "The policy engine can decide on file transfers, proofs and receipts and keeps a spending ledger (M1-7i). Not used by any tool yet."
      - name: "SSRF-safe fetch and the allowed-folder path guard"
        state: done
        prs: [208]
        summary: "One checked way to fetch a URL and to open a file inside an allowed folder, with a file-name cleaner (M1-15). Not wired into any tool yet."
      - name: "Terms and one approval per agreement"
        state: done
        prs: [126, 134, 363]
        summary: "Offers, counters, rejects and accepts with the chain fields filled from the agent's own store; the negotiation rules (no forks, lock after an accept, conflicts and anchored resends) applied on receive; an accept asks the owner once per agreement, or runs within the owner-signed auto-accept limits, and is sent at most once (M1-32, D-55). Repeats under one clientRequestId send nothing, and revisions that arrive out of order are applied in link order (M1-32-b). The deferred Accepted receipt has landed (M1-7g-d); firm offers and recorded accepts, each under one owner approval with the proof fee on the same request, are merged for the next release (M1-9d-3). Counters and rejects with proof are still refused."
      - name: "Agent profile signatures"
        state: done
        prs: [300]
        summary: "Agents sign their own profile with both of their keys when they set up and rotate keys, and exchange and check those signatures when they pair; a forged signature is ignored, and an agent on an older version without them still pairs (M1-4d-d-b). Carrying the signatures in profile updates is merged too (M1-4d-f)."
      - name: "Proofs, receipts and proof packs"
        state: done
        prs: [306, 315]
        summary: "Released in 0.1.2 (not in v0.1.1): notarizing a sent message, receipts and exporting a proof pack (M1-7g). The recipient can export a proof pack too, from the signed record the sender passes along end to end encrypted and that the recipient checks against the chain first (M1-7g-b, D-107). Proof runs on test networks only."
      - name: "Delivery receipts off by default, receipt requests"
        state: done
        prs: [325, 333, 347]
        summary: "Merged for the next release (after 0.1.2), not in v0.1.2. A delivery receipt shows publicly that a recorded message reached the agent, so it is signed only when the rules allow it for that contact, or the owner says yes to the sender's request (M1-33a, M1-33d, D-109). Adding proof can ask the contact to confirm delivery; asking confirms nothing by itself. Rules from the old default are flagged by `agentlink doctor` and need a yes at the next signing. Confirming that the other side accepted terms signs the matching receipt once under the one approval (M1-7g-d)."
      - name: "Proof linking and mismatch flags"
        state: done
        prs: [323, 329, 347]
        summary: "Merged for the next release (after 0.1.2). A proof links only to the same agent's earlier proof, never to the other side's, so no public link between two agents appears without a receipt (M1-33c). A proof from another agent that does not match the chain, including one that links to someone else's, is refused and the contact is flagged; one contact can no longer fill the queue of proofs waiting for a network check and gets at most 32 of its 256 places (M1-7g-c, M1-7g-d). Log codes come from a fixed list per component."
      - name: "Delete a sent file on receipt"
        state: done
        prs: [313, 339, 346]
        summary: "Merged for the next release (after 0.1.2). With the rule `files.deleteAfter: receipt`, the agent deletes a sent file from storage (the encrypted drop or your own) once the contact's delivery receipt is on record, using the key generation the file was uploaded under (M1-1g-h). The rule is recorded with each file at send time, so switching to it later never deletes files sent earlier (M1-1g-i). Without a receipt nothing is deleted and the file stays until it expires."
