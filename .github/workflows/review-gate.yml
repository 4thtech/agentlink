# Review gate: security class and review evidence (docs/process/audit-rules.md §2-§3, decision D-25).
#
# Required status check: `review-gate`.
#
# Agents may enable GitHub auto-merge; GitHub then merges only when every required check is
# green. This check adds what CODEOWNERS cannot see (owner Decision 54: the class is computed,
# formalities warn, the AI review is required only where the risk is):
#   (a) computes the security class from the changed files. The rules mirror the path defaults
#       of audit-rules.md §2.2, and the highest class wins; it also marks the sensitive paths
#       (.github/**, AGENTS.md, CLAUDE.md, .claude/**, supply-chain files). Keep both in sync with
#       audit-rules.md. tools/pr/classes.mjs reads the marked block, so there is one copy.
#   (b) the PR body's "Security class" declaration: missing, or lower than the computed class, is a
#       WARNING (the computed class applies). A higher declaration raises the class (§2.4).
#   (c) S2 and sensitive paths: the "Independent review" section must reference a review report
#       (an `IR-...` ID, audit-rules.md §4.3). Any class: a stated FAIL verdict fails.
#       S0 and S1 outside the sensitive paths need no review line (builder tests suffice).
#       This is attested by the orchestrator: CI checks that the report is referenced, not that
#       the review happened. The report itself is private (audit-rules.md §4.5).
#       Automated PRs (see below) satisfy (c) by a code-owner approval on the head commit instead,
#       for every S1/S2 change.
#   (d) S2: non-empty "Threat note" and "Tests-first evidence" sections (the RED commit SHA,
#       command and output, audit-rules.md §3.4). The S2 code-owner approval check was removed by
#       the owner (D-51, simplified); the owner's "merge" is a process control.
#   (e) fails while the repository variable DEPLOY_FREEZE is 'true'. Setting the variable does
#       not re-run this check on open pull requests: whoever sets the freeze also disables
#       auto-merge on open PRs (release-and-deployment.md §3.1).
# The class used for (c) and (d) is the higher of the computed and the declared class, so a
# content-rule S2 (audit-rules.md §2.4) on an S1 path still needs the S2 evidence.
#
# Automated PRs (Renovate, Changesets "Version packages"): a PR is automated only when its AUTHOR
# (`pull_request.user.login`, set by GitHub from the account or app that opened it) is
# `renovate[bot]` or `github-actions[bot]`. Commit author names, e-mail addresses and the
# `verified` flag are NOT consulted: they can be forged by anyone who can push to the branch.
# For an automated PR, (c) is satisfied only by an APPROVED review by @talirezun or @denisjazbec
# on the current head commit (a new commit invalidates it); there is no report ID to cite.
# (b) never fails for it. (d) applies unchanged for S2, including the
# "Threat note" and "Tests-first evidence" sections: bot-supplied (renovate.json prBodyNotes),
# approver confirms (owner decision 2026-10-15, audit-rules.md §3, §3.4).
# The bot is the author, so any code owner's approval counts. There is no other exemption.
# Owner action (ci-cd.md checklist): restrict who may push to `renovate/**` and
# `changeset-release/**` branches, so that nobody else can add commits to a bot-authored PR.
#
# Pull request titles, bodies, file names and patches are attacker-controlled text. They are read
# through the API inside actions/github-script and are never interpolated into a shell script or
# into the script source; they are logged only as JSON strings. Uses `pull_request` and
# `pull_request_review` (never `pull_request_target`), checks out nothing, uses no secrets.
#
# Skeleton-tolerant: needs nothing but the pull request. A docs-only S0 PR passes; an unticked
# Security class box only warns.
name: Review gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches-ignore: [sync]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # A merge queue is optional. On merge_group runs only (e) is checked; (a)-(d) passed on the PR.
  merge_group:

permissions: {}

# OPS-UNSTICK-A: never cancel a run in progress. A close/reopen or an edit (the IR line added after
# the PR opened) used to cancel the run in flight and leave a cancelled required check (#772,
# #770, #761). Runs of one PR now queue: GitHub keeps only the newest pending run, nothing in
# flight is cancelled, and the last run decides the check. The job takes seconds.
concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review-gate:
    name: review-gate
    # pull_request_review has no branch filter: ignore reviews on PRs into the coordination branch.
    if: github.event_name == 'merge_group' || github.event.pull_request.base.ref != 'sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # repository metadata for the API calls
      pull-requests: read # the PR, its changed files, commits and reviews
    steps:
      - name: Check security class, review evidence and deploy freeze
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        with:
          script: |
            const problems = [];
            const warnings = [];
            const show = (s) => JSON.stringify(String(s));
            const CLASS_NAMES = ['S0', 'S1', 'S2'];

            // (e) Deploy freeze.
            if ((process.env.DEPLOY_FREEZE ?? '').trim().toLowerCase() === 'true') {
              problems.push(
                'DEPLOY_FREEZE is set: nothing merges until the owner clears it (release-and-deployment.md §3.1).',
              );
            }

            const finish = () => {
              for (const warning of warnings) core.warning(warning);
              if (problems.length > 0) {
                for (const problem of problems) core.error(problem);
                core.setFailed(`review-gate: ${problems.length} problem(s). See the annotations above.`);
              } else {
                core.info('review-gate: all requirements met.');
              }
            };

            if (context.eventName === 'merge_group') {
              finish();
              return;
            }

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setFailed('No pull request in the event payload.');
              return;
            }

            // Always read the current state; a review event's payload can be older than the PR.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            // A draft fails fast with one line: its independent review is still pending. The job never
            // reports "skipped" (a skipped required check counts as passed), so no draft-to-ready window
            // exists in which an unchecked head could merge. The full gate runs on `ready_for_review`.
            if (pr.draft) {
              problems.push('Draft PR: review-gate runs in full once the PR is marked ready for review.');
              finish();
              return;
            }
            const author = (pr.user?.login ?? '').toLowerCase();
            const headSha = pr.head?.sha ?? '';
            const CODE_OWNERS = ['talirezun', 'denisjazbec'];
            // Automated PR: decided ONLY by the PR author, which GitHub sets and nobody can forge.
            // Commit author names, e-mail addresses and the "verified" flag are never consulted.
            const BOT_AUTHORS = ['renovate[bot]', 'github-actions[bot]'];
            const isBotPr = BOT_AUTHORS.includes(author);

            // (a) Derive the class from the changed files (audit-rules.md §2.2; highest wins).
            // BEGIN path-classes: tools/pr/classes.mjs reads this block, so open-pr.mjs and the tests use the same rules.
            const RULES = [
              [2, /^packages\/(crypto|core|node)\//],
              [2, /^apps\/(console|cloud-agent|submitter|drop)\//],
              [2, /^test-vectors\//],
              [2, /^docs\/foundation\/04-security-and-crypto\.md$/],
              [1, /^packages\/(chain|transport-nostr|storage|types|ui|mcp-tools)\//],
              [1, /^apps\/(cli|verify|invite)\//],
              [1, /^(e2e|skills)\//],
              [1, /^\.github\//],
              [1, /^\.claude\//],
              [1, /^(renovate\.json|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$/],
              // pnpm and npm configuration at any depth: .npmrc, and pnpm hook files (.pnpmfile.cjs, .pnpmfile.mjs),
              // which pnpm executes (audit-rules.md §2.2; the composite action refuses them).
              [1, /(^|\/)(\.npmrc|\.pnpmfile\.[^/]+)$/],
              [1, /^(\.gitleaks\.toml|\.gitleaksignore|\.changeset\/config\.json)$/],
              // Release tooling: release.yml runs these scripts in jobs holding the npm OIDC token (CODEOWNERS).
              [1, /^tools\/release\//],
              [1, /^docs\/(foundation|process)\//],
              [1, /^(AGENTS|CLAUDE|SECURITY)\.md$/],
              // Public docs, published on merge (D-57). Owner decision 2026-10-25 (CHORE-CI-DOCS-FASTLANE):
              // the one generated page is exempt; its source docs/status.yaml is S0 and tools/docs-status
              // fails CI on any drift between the two.
              [1, /^docs-site\/(?!technical\/project\/status-and-roadmap\.md$)/],
            ];
            const classify = (path) =>
              RULES.reduce((highest, [cls, re]) => (re.test(path) ? Math.max(highest, cls) : highest), 0);
            // Sensitive paths (AGENTS.md merging rules, audit-rules.md §3): CI and release configuration, agent
            // rules and harness settings, supply-chain files. At any class they need the independent review.
            const SENSITIVE = [
              /^\.github\//,
              /^\.claude\//,
              /^(AGENTS|CLAUDE)\.md$/,
              /^(renovate\.json|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json)$/,
              /(^|\/)(\.npmrc|\.pnpmfile\.[^/]+)$/,
              /^(\.gitleaks\.toml|\.gitleaksignore|\.changeset\/config\.json)$/,
              /^tools\/release\//,
            ];
            const isSensitive = (path) => SENSITIVE.some((re) => re.test(path));
            // END path-classes

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });
            let derived = 0;
            const sensitivePaths = [];
            for (const f of files) {
              for (const path of [f.filename, f.previous_filename].filter(Boolean)) {
                derived = Math.max(derived, classify(path));
                if (isSensitive(path)) sensitivePaths.push(path);
              }
            }
            let sensitive = sensitivePaths.length > 0;
            const fileListComplete = files.length === pr.changed_files;
            if (!fileListComplete) {
              // The files API stops at 3000 entries. Fail closed.
              derived = 2;
              sensitive = true;
              core.warning(`Listed ${files.length} of ${pr.changed_files} changed files; treating the PR as S2.`);
            }
            core.info(`Computed security class from ${files.length} changed file(s): ${CLASS_NAMES[derived]}`);
            if (sensitivePaths.length > 0) {
              core.info(`Sensitive paths: ${sensitivePaths.slice(0, 10).map(show).join(', ')}`);
            }

            // Parse the PR body like pr-hygiene: "##"/"###" headings; HTML comments and fenced code ignored.
            const body = (pr.body ?? '').replace(/\r\n?/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
            const sections = [];
            let current = null;
            let inFence = false;
            for (const line of body.split('\n')) {
              if (/^\s*(```|~~~)/.test(line)) inFence = !inFence;
              const heading = inFence ? null : /^#{2,3}\s+(.+?)\s*#*\s*$/.exec(line);
              if (heading) {
                current = { heading: heading[1], lines: [] };
                sections.push(current);
              } else if (current) {
                current.lines.push(line);
              }
            }
            const sectionText = (re) => {
              const s = sections.find((x) => re.test(x.heading));
              return s ? s.lines.join('\n').trim() : null;
            };
            const PLACEHOLDER = /^(n\/?a|none|tbd|todo|-+|\.\.\.|…)\.?$/i;
            const filled = (text) => text !== null && text !== '' && !PLACEHOLDER.test(text);

            // Declared class: exactly one ticked S0/S1/S2 box in the "Security class" section.
            let declared = null;
            const classText = sectionText(/^security class\b/i);
            if (classText !== null) {
              const ticked = classText
                .split('\n')
                .map((l) => /^\s*[-*+]\s+\[[xX]\]\s*[*_`]*S([012])\b/.exec(l))
                .filter(Boolean);
              if (ticked.length === 1) declared = Number(ticked[0][1]);
            }

            // (b) The class is computed from the paths. A declaration is only checked against it: a missing or
            // lower declaration is a warning, never a failure (owner Decision 54). A HIGHER declaration raises
            // the class (a content-rule S2 on an S1 path, audit-rules.md §2.4), so its S2 evidence is still required.
            let effective = derived;
            if (declared === null) {
              if (!isBotPr) {
                warnings.push(
                  `Security class: no single box ticked; the computed class ${CLASS_NAMES[derived]} applies ` +
                    '(tools/pr/open-pr.mjs ticks it for you).',
                );
              }
            } else {
              effective = Math.max(derived, declared);
              if (declared < derived) {
                warnings.push(
                  `Security class: declared ${CLASS_NAMES[declared]}, but the changed files are ${CLASS_NAMES[derived]} ` +
                    `(audit-rules.md §2.2); the computed class ${CLASS_NAMES[derived]} applies.`,
                );
              }
            }
            core.info(`Effective security class: ${CLASS_NAMES[effective]}${sensitive ? ' on sensitive paths' : ''}`);
            // The independent review is required for S2 and for sensitive paths only (owner Decision 54).
            const reviewRequired = effective === 2 || sensitive;

            // Code-owner approvals on the current head commit. The latest non-comment review of each user
            // counts, so a later "changes requested" or a dismissal removes an approval, and a new commit
            // (a different head SHA) invalidates it. Needed for S2 (d) and for automated PRs (c).
            let approvers = [];
            if (effective === 2 || (isBotPr && (effective >= 1 || sensitive))) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });
              const latest = new Map();
              for (const r of reviews) {
                const login = (r.user?.login ?? '').toLowerCase();
                if (!login || r.state === 'COMMENTED' || r.state === 'PENDING') continue;
                latest.set(login, r); // chronological order: the last state wins
              }
              approvers = [...latest.entries()]
                .filter(([login]) => CODE_OWNERS.includes(login) && login !== author)
                .filter(([, r]) => r.state === 'APPROVED' && r.commit_id === headSha)
                .map(([login]) => login);
            }

            // (c) Independent review: S2 and sensitive paths. An automated PR keeps the code-owner approval for
            // every S1/S2 or sensitive change (it has no builder tests to rely on). A FAIL verdict always fails.
            const review = sectionText(/^independent review\b/i);
            if (!isBotPr && filled(review) && /verdict\W{0,4}fail\b/i.test(review)) {
              problems.push('Independent review: the referenced review verdict is FAIL.');
            }
            if (isBotPr ? effective >= 1 || sensitive : reviewRequired) {
              if (isBotPr) {
                // Automated PR: no report to cite. Only a code owner's approval on the head commit counts.
                if (approvers.length === 0) {
                  problems.push(
                    `${CLASS_NAMES[effective]}: the PR is authored by ${show(author)}; its independent review is satisfied ` +
                      'only by an APPROVED review on the current head commit by @talirezun or @denisjazbec ' +
                      '(audit-rules.md §3.3). The commit author and "verified" flags are not trusted.',
                  );
                } else {
                  core.info(`Automated PR by ${show(author)}: code-owner approval on the head commit by: ${approvers.map(show).join(', ')}`);
                }
              } else {
                const why = effective === 2 ? 'S2' : `${CLASS_NAMES[effective]} on sensitive paths`;
                if (!filled(review)) {
                  problems.push(
                    `${why}: the "Independent review" section is empty. ` +
                      'Add the report line (audit-rules.md §4.5): report ID, verdict, finding counts, tracker IDs.',
                  );
                } else if (!/\bIR-[A-Za-z0-9]+(-[A-Za-z0-9]+)+\b/.test(review)) {
                  problems.push(`${why}: no review report ID (IR-<TASK-ID>-<n>) found under "Independent review".`);
                }
              }
            } else {
              core.info(`${CLASS_NAMES[effective]} outside the sensitive paths: no independent review required (Decision 54).`);
            }

            // (d) S2: non-author code-owner approval on the head commit, threat note, tests-first evidence.
            if (effective === 2) {
              if (approvers.length > 0) {
                core.info(`S2 approval on the head commit by: ${approvers.map(show).join(', ')}`);
              }
              if (!filled(sectionText(/^threat note\b/i))) {
                problems.push('S2: the "Threat note" section is empty (full threat note, audit-rules.md §3.1).');
              }
              if (!filled(sectionText(/^tests-first evidence\b/i))) {
                problems.push(
                  'S2: the "Tests-first evidence" section is empty (RED commit SHA, command and local output excerpt, audit-rules.md §3.4).',
                );
              }
            }

            finish();
