# CI: lint, typecheck, build, test, cross-runtime test vectors, context size budgets.
#
# Skeleton-tolerant: the monorepo skeleton (package.json, pnpm-lock.yaml,
# turbo.json) does not exist yet. The `detect` job looks at what is in the
# repository and every Node job skips cleanly when there is nothing to run, so
# this workflow is green on a docs-only repo and activates by itself once the
# skeleton lands. To turn "skip" into "fail" for missing root scripts, commit an
# empty file `.github/ci-strict` (see docs/process/ci-cd.md).
#
# `ci-gate` is the single required status check for this workflow.
#
# Security posture (docs/foundation/04 §7): no secrets, read-only token, every
# action pinned to a full commit SHA, no lifecycle scripts on install,
# no event data interpolated into shell scripts.
name: CI

# CI runs on every branch push (lint and tests before the independent
# review; red evidence is local, never a pushed failing state) and again on the pull request, which is opened after that review. Once a PR exists a
# push produces two runs (one per event); that duplicate is accepted. The coordination branch
# `sync` (markdown only, pushed directly) never runs CI: pushes to it and pull requests into it
# are ignored. Tags do not trigger it. Only the `changesets` job (pull requests only) reads
# `github.event.pull_request` (author and head repository, through `env:`, to recognise the bot's
# "Version packages" PR); every other job behaves the same on a push, with the repository content
# as the only input.
on:
  pull_request:
    branches-ignore: [sync]
  push:
    branches-ignore: [sync]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a branch or PR supersedes the older run; runs on `main` are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  # No remote cache, no telemetry: CI holds no secrets and talks to nobody but the registry.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_skeleton: ${{ steps.detect.outputs.has_skeleton }}
      has_lint: ${{ steps.detect.outputs.has_lint }}
      has_typecheck: ${{ steps.detect.outputs.has_typecheck }}
      has_build: ${{ steps.detect.outputs.has_build }}
      has_test: ${{ steps.detect.outputs.has_test }}
      has_vectors_script: ${{ steps.detect.outputs.has_vectors_script }}
      needs_playwright: ${{ steps.detect.outputs.needs_playwright }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect skeleton and root scripts
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          strict=false
          if [ -f .github/ci-strict ]; then strict=true; fi

          # Missing pieces are a warning while the skeleton is being built and an
          # error once the repository opts in with .github/ci-strict.
          fail_or_warn() {
            if [ "$strict" = true ]; then
              echo "::error::$1 (strict mode: .github/ci-strict exists)"
              exit 1
            fi
            echo "::warning::$1 (skipped; commit .github/ci-strict to make this fatal)"
          }

          has_skeleton=false
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            has_skeleton=true
            case "$(jq -r '.packageManager // ""' package.json)" in
              pnpm@*) ;;
              *)
                echo '::error file=package.json::package.json must pin pnpm through the "packageManager" field (for example pnpm@10.0.0).'
                exit 1
                ;;
            esac
          elif [ -f package.json ] || [ -f pnpm-lock.yaml ]; then
            fail_or_warn "package.json and pnpm-lock.yaml must be committed together"
          else
            echo "::notice::No pnpm workspace yet (docs-only repository); Node jobs are skipped."
          fi
          out has_skeleton "$has_skeleton"

          script_exists() {
            [ "$has_skeleton" = true ] && jq -e --arg s "$1" '(.scripts // {}) | has($s)' package.json > /dev/null
          }

          # check_script <output key> <root script> <required in strict mode: true|false>
          check_script() {
            if script_exists "$2"; then
              out "$1" true
            else
              out "$1" false
              if [ "$has_skeleton" = true ]; then
                if [ "$3" = true ]; then
                  fail_or_warn "Root package.json has no \"$2\" script"
                else
                  echo "::notice::Root package.json has no \"$2\" script; that step is skipped."
                fi
              fi
            fi
          }

          check_script has_lint lint true
          check_script has_typecheck typecheck true
          check_script has_build build true
          check_script has_test test true
          # Required in strict mode since M0-9: a deleted vectors:check script must not turn
          # the vectors job into a silent skip.
          check_script has_vectors_script vectors:check true

          # Browsers are only downloaded when Playwright is a root devDependency. The lockfile
          # is not a signal: it lists Playwright as an optional peer of Vitest (IR-M0-2d-1 F07).
          needs_playwright=false
          if [ "$has_skeleton" = true ] && jq -e '(.devDependencies // {}) | has("playwright") or has("@playwright/test")' package.json > /dev/null; then
            needs_playwright=true
          fi
          out needs_playwright "$needs_playwright"

  checks:
    name: checks
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        # A dependency that needs its install script is allowed here explicitly, for example:
        #   with:
        #     rebuild: <package>
        # better-sqlite3 (packages/node) needs none: it ships prebuilt binaries and no install script.

      # Package tests that run in browsers (Playwright) need the engines (M1-2c).
      - name: Install Playwright browsers
        if: needs.detect.outputs.needs_playwright == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Task ordering and caching are turbo's job; the root scripts call `turbo run ...`.
      - name: Lint
        if: needs.detect.outputs.has_lint == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.detect.outputs.has_typecheck == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.detect.outputs.has_build == 'true'
        run: pnpm build

      - name: Unit tests
        if: needs.detect.outputs.has_test == 'true'
        run: pnpm test

      # Named so the MCP conformance gate (06 §9, M1-9e) is visible in the CI log: the tool-surface
      # snapshot and rules, and an MCP SDK client validating every tool over real stdio. Both also run
      # inside `pnpm test` above; this step repeats them on purpose (about a second).
      - name: MCP tool surface and conformance
        if: needs.detect.outputs.has_test == 'true'
        run: pnpm --filter @4thtech-io/agentlink exec vitest run test/tool-surface.test.ts test/mcp-conformance.test.ts

  vectors:
    name: vectors
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true' && needs.detect.outputs.has_vectors_script == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history: the pending-suites check needs the merge base with main.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Requires playwright (or @playwright/test) as a root devDependency (docs/process/ci-cd.md).
      # The vectors run in all three Playwright engines (M0-9).
      - name: Install Playwright browsers
        if: needs.detect.outputs.needs_playwright == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Python for the independent vector generators, fixed at the version requirements.txt was
      # compiled for (every pinned package has a cp312 wheel), whatever the runner image ships.
      - name: Set up Python for the vector generators
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The generators' pinned Python packages (M1-1h): every package, transitive ones included, is
      # pinned with hashes; wheels only (no sdist build code runs) and no dependency resolution.
      - name: Install the vector generators' pinned Python packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vectors-py"
          "$RUNNER_TEMP/vectors-py/bin/python" -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps -r tools/vectors/requirements.txt
          echo "VECTORS_PYTHON=$RUNNER_TEMP/vectors-py/bin/python" >> "$GITHUB_ENV"

      # Provenance: every committed vector file must equal the output of the independent generator
      # it names (a script under tools/vectors/, run in `--check FILE` mode, which writes nothing).
      - name: Check committed vectors against their independent generators
        run: node tools/vectors/check-generators.mjs

      # Pending suites (vectors before their code, M1-1h) may only shrink against the point where this
      # ref left main: a suite that was implemented on main can never become pending again
      # (IR-M1-1h-1 F2). The base is the merge base with main, not today's tip of main, so a branch or
      # pull request that is merely behind main never fails for what main changed since. On main itself
      # (the merge base is HEAD) the base is the previous commit. On a pull request run HEAD is the
      # merge ref, so the merge base is the main commit the ref was created from.
      - name: Check that pending vector suites only shrink against the merge base with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          base="$(git merge-base HEAD origin/main)"
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            base="$(git rev-parse HEAD^1)"
          fi
          echo "Pending-suites base: $base"
          node tools/vectors/check-pending.mjs --base "$base"

      # The workspace packages are built before the vectors run, so a cross-package import resolves
      # (dist/) in every runtime without a source alias per package (a missing build was the cause of
      # three red runs). The suites that must test source still use their aliases in
      # test-vectors/vitest.config.ts.
      - name: Build the workspace packages
        run: pnpm exec turbo run build

      # Crypto + EIP-712 vectors across Node, browsers (Playwright) and Workers (workerd).
      - name: Check test vectors across runtimes
        run: pnpm vectors:check

      # Vectors come from an independent generator and are committed; tests only read them
      # (docs/process/development-process.md §10). Independent of the runner's own check.
      - name: Fail if the run created or changed anything under test-vectors/
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain --untracked-files=all -- test-vectors)"
          if [ -n "$changes" ]; then
            # Paths are not echoed (they could carry workflow commands); the runner's own output names them.
            echo "::error::The vector run wrote to test-vectors/ ($(printf '%s\n' "$changes" | wc -l | tr -d ' ') path(s)). Tests must never write or regenerate vector files."
            exit 1
          fi

  # M1-8a-b: the real-keychain suite (packages/node/src/keychain-native.test.ts) on the three OS
  # keychains: macOS Keychain, Windows Credential Manager and the Linux Secret Service
  # (gnome-keyring in a headless D-Bus session). AGENTLINK_REQUIRE_KEYCHAIN=1 turns a failed
  # keychain probe into a failed test instead of a skip, so a runner without a working keychain
  # cannot pass green. The suite writes only under a random `agentlink-test-*` service on the
  # ephemeral runner and deletes it afterwards. The job runs only the keychain-specific tests (the
  # keychain file and the CLI two-process test), so unrelated slow or timing-sensitive suites cannot
  # turn it red; the whole @agentlink/node suite runs in `checks` (Linux) and in `node-os` below
  # (macOS and Windows). `keychain` is in `ci-gate`'s `needs`; it needs the CLI two-process test from
  # PR #107 on main, so that PR must merge first.
  keychain:
    name: keychain (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Exact runner images, no `*-latest` (M1-8a-d): an image change must not silently change the
        # keychain behaviour under test. These are the images `*-latest` resolved to when pinned
        # (2026-10-15); a bump is its own reviewed change.
        os: [macos-26, windows-2025-vs2026, ubuntu-24.04]
    env:
      AGENTLINK_REQUIRE_KEYCHAIN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Choose the test report path
        shell: bash
        run: |
          echo "KEYCHAIN_REPORT=$RUNNER_TEMP/keychain-vitest.json" >> "$GITHUB_ENV"
          echo "CLI_KEYCHAIN_REPORT=$RUNNER_TEMP/cli-keychain-vitest.json" >> "$GITHUB_ENV"

      # Secret Service for @napi-rs/keyring (libsecret): gnome-keyring and a session bus. The
      # keyring itself is started and unlocked in the test step, inside the D-Bus session.
      - name: Install gnome-keyring and D-Bus (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-1-0 dbus

      # The workspace dependencies of @agentlink/node (core, crypto) are consumed from dist/. The
      # CLI package and its dependencies are built too: the child processes of the CLI two-process
      # test run apps/cli's dist/.
      - name: Build the workspace dependencies of @agentlink/node and the CLI
        shell: bash
        run: pnpm exec turbo run build --filter='@4thtech-io/agentlink...'

      - name: Run the keychain tests against the real keychain (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @agentlink/node exec vitest run src/keychain-native.test.ts --reporter=default --reporter=json --outputFile.json="$KEYCHAIN_REPORT"
          pnpm --filter @4thtech-io/agentlink exec vitest run test/two-process.keychain.test.ts --reporter=default --reporter=json --outputFile.json="$CLI_KEYCHAIN_REPORT"

      # A fresh D-Bus session, then gnome-keyring started with --unlock, which creates and unlocks
      # the default ("login") collection from a throwaway password read on stdin (random per run,
      # never printed; the runner is ephemeral).
      - name: Run the keychain tests against the real keychain (Linux, gnome-keyring)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          dbus-run-session -- bash -euo pipefail -c '
            keyring_env="$(openssl rand -hex 16 | gnome-keyring-daemon --unlock --components=secrets)"
            eval "$keyring_env"
            export GNOME_KEYRING_CONTROL
            pnpm --filter @agentlink/node exec vitest run src/keychain-native.test.ts --reporter=default --reporter=json --outputFile.json="$KEYCHAIN_REPORT"
            pnpm --filter @4thtech-io/agentlink exec vitest run test/two-process.keychain.test.ts --reporter=default --reporter=json --outputFile.json="$CLI_KEYCHAIN_REPORT"
          '

      # "Runs with no skipped test" (M1-8a-b acceptance): the keychain suite must have run and
      # passed in full on this OS. Other files of the package may skip tests of their own; the
      # keychain file may not.
      - name: Check that keychain-native.test.ts ran in full, with no skipped test
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.env.KEYCHAIN_REPORT, "utf8"));
            const files = report.testResults.filter((f) => /keychain-native\.test\.ts$/.test(f.name.replace(/\\/g, "/")));
            if (files.length !== 1) { console.error("::error::keychain-native.test.ts did not run"); process.exit(1); }
            const tests = files[0].assertionResults;
            const bad = tests.filter((t) => t.status !== "passed");
            console.log(`keychain-native.test.ts: ${tests.length} tests, ${bad.length} not passed`);
            if (tests.length < 3 || bad.length > 0) { console.error("::error::keychain-native.test.ts must run at least 3 tests, all passed (none skipped)"); process.exit(1); }
          '

      # The CLI two-process keychain test (apps/cli/test/two-process.keychain.test.ts) is opt-in on
      # AGENTLINK_REQUIRE_KEYCHAIN=1, which this job sets: it must have run, 1 test, passed, none
      # skipped. A missing file fails the vitest step above (no test files found) and this check.
      - name: Check that two-process.keychain.test.ts ran with 1 test passed and none skipped
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.env.CLI_KEYCHAIN_REPORT, "utf8"));
            const files = report.testResults.filter((f) => /two-process\.keychain\.test\.ts$/.test(f.name.replace(/\\/g, "/")));
            if (files.length !== 1) { console.error("::error::two-process.keychain.test.ts did not run"); process.exit(1); }
            const tests = files[0].assertionResults;
            const bad = tests.filter((t) => t.status !== "passed");
            console.log(`two-process.keychain.test.ts: ${tests.length} tests, ${bad.length} not passed`);
            if (tests.length !== 1 || bad.length > 0) { console.error("::error::two-process.keychain.test.ts must run exactly 1 test, passed (none skipped)"); process.exit(1); }
          '

  # The whole @agentlink/node suite on macOS and Windows (it used to run inside the keychain job).
  # Not part of `ci-gate`: OS-timing flakes in unrelated suites must not block merges, but a real
  # OS-specific bug stays visible here. The keychain files themselves run in `keychain`.
  node-os:
    name: node-os (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The same exact images as `keychain` (no `*-latest`).
        os: [macos-26, windows-2025-vs2026]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build the workspace dependencies of @agentlink/node
        shell: bash
        run: pnpm exec turbo run build --filter='@agentlink/node...'

      - name: Run the @agentlink/node tests
        shell: bash
        run: pnpm --filter @agentlink/node exec vitest run

  # M1-5b-b: the Node relay connector's Docker suite (packages/node/src/relay-docker.test.ts): the
  # pool and the outbox against real relays, strfry and rnostr, pinned by digest in the test file.
  # AGENTLINK_REQUIRE_DOCKER=1 turns a missing Docker daemon into a failed test instead of a skip.
  # Part of `ci-gate`'s `needs` (it had run green on main before it joined).
  relays-docker:
    name: relays-docker
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      AGENTLINK_REQUIRE_DOCKER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build the workspace dependencies of @agentlink/node
        run: pnpm exec turbo run build --filter='@agentlink/node^...'

      - name: Choose the test report path
        run: echo "DOCKER_REPORT=$RUNNER_TEMP/relay-docker-vitest.json" >> "$GITHUB_ENV"

      - name: Run the Docker relay suite
        run: pnpm --filter @agentlink/node exec vitest run src/relay-docker.test.ts --reporter=default --reporter=json --outputFile.json="$DOCKER_REPORT"

      - name: Check that relay-docker.test.ts ran in full, with no skipped test
        run: |
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.env.DOCKER_REPORT, "utf8"));
            const f = r.testResults.filter((x) => /relay-docker\.test\.ts$/.test(x.name));
            const t = f.length === 1 ? f[0].assertionResults : [];
            const bad = t.filter((x) => x.status !== "passed");
            console.log(`relay-docker.test.ts: ${t.length} tests, ${bad.length} not passed`);
            if (t.length < 4 || bad.length > 0) { console.error("::error::the Docker relay suite must run 4+ tests, all passed"); process.exit(1); }
          '

  # M1-9c-c (IR-M1-9c-1 F07; D-76, 06 §1): the neutral-platform bundle check. A plain Linux runner
  # with no keychain service and no native-module build (the install runs no lifecycle scripts)
  # builds the CLI bundle with the repository's own Vite config (no new dependency) and runs
  # apps/cli/scripts/bundle-check.mjs: every import the published dist/agentlink.js keeps must be a
  # Node built-in or a declared runtime dependency, never jose, pkce-challenge, cookie-signature,
  # etag, hono or another SDK HTTP/OAuth package, and SDK imports only the stdio subpaths; and
  # src/tools/ bundled for a neutral (Worker) platform reaches no Node built-in, @agentlink/node or
  # the MCP SDK. The script's own test (an injected `jose` import must fail it) and the runtime
  # module-graph guard against the bundle run in the same job. In `ci-gate`'s `needs`.
  bundle-check:
    name: bundle-check
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build the CLI bundle and its workspace dependencies
        run: pnpm exec turbo run build --filter='@4thtech-io/agentlink...'

      - name: Check the published bundle and the neutral src/tools/ bundle
        run: node apps/cli/scripts/bundle-check.mjs

      - name: Run the bundle-check test and the module-graph guard against the bundle
        run: pnpm --filter @4thtech-io/agentlink exec vitest run test/bundle-check.test.ts test/mcp-module-graph.test.ts

  # AGENTS.md and CLAUDE.md are auto-loaded into every agent session, so they have hard
  # size budgets to keep context lean. Plain shell, no Node skeleton needed: this job runs
  # on a docs-only repository too and does not depend on `detect`. A missing file passes.
  context-budget:
    name: context-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check auto-loaded context files against their byte budgets
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          # check_budget <file> <max bytes>
          check_budget() {
            local file="$1" budget="$2" size
            if [ ! -f "$file" ]; then
              echo "::notice::$file does not exist; nothing to check."
              return 0
            fi
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            if [ "$size" -gt "$budget" ]; then
              echo "::error file=$file::$file is $size bytes, over its budget of $budget bytes (over by $((size - budget)) bytes). It is auto-loaded into every agent session: move detail into docs/ and link to it."
              failed=1
            else
              echo "$file: $size of $budget bytes (ok)"
            fi
          }

          check_budget AGENTS.md 8192
          check_budget CLAUDE.md 1024

          exit "$failed"

  # D-43 (OPS-CI-2): a pull request that changes a published (non-private) package must add a
  # changeset. `changeset status --since <merge base with main>` fails otherwise; docs-only changes
  # and private packages pass. Pull requests only: the push run of a branch is not a merge
  # candidate. The one exemption is the Changesets "Version packages" PR (it consumes the
  # changesets): branch `changeset-release/*` by `github-actions[bot]` in this repository. The PR
  # fields reach the script through `env:` only.
  changesets:
    name: changesets
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.has_skeleton == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history: Changesets diffs against the merge base with main.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Require a changeset for a changed published package
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node tools/release/check-changesets.mjs --base origin/main

  ci-gate:
    # A push run on a feature branch tests the branch tip, while the pull request run tests the
    # merge with `main`. Only the latter may satisfy the required check `ci-gate`, so a feature
    # branch push publishes `ci-gate (push)` instead.
    name: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'ci-gate (push)' || 'ci-gate' }}
    needs: [detect, checks, vectors, keychain, context-budget, relays-docker, bundle-check, changesets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded or been skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::An upstream job ended as '$result'."
                exit 1
                ;;
            esac
          done
