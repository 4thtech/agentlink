# CI: lint, typecheck, build, test, cross-runtime test vectors, context size budgets.
#
# Skeleton-tolerant: the monorepo skeleton (package.json, pnpm-lock.yaml,
# turbo.json) does not exist yet. The `detect` job looks at what is in the
# repository and every Node job skips cleanly when there is nothing to run, so
# this workflow is green on a docs-only repo and activates by itself once the
# skeleton lands. To turn "skip" into "fail" for missing root scripts, commit an
# empty file `.github/ci-strict` (see docs/process/ci-cd.md).
#
# `ci-gate` is the single required status check for this workflow.
#
# Security posture (docs/foundation/04 §7): no secrets, read-only token, every
# action pinned to a full commit SHA, no lifecycle scripts on install,
# no event data interpolated into shell scripts.
name: CI

# CI runs on every branch push (lint and tests before the independent
# review; red evidence is local, never a pushed failing state) and again on the pull request, which is opened after that review. Once a PR exists a
# push produces two runs (one per event); that duplicate is accepted. The coordination branch
# `sync` (markdown only, pushed directly) never runs CI: pushes to it and pull requests into it
# are ignored. Tags do not trigger it. Nothing here reads `github.event.pull_request`, so every
# job behaves the same on a push; the repository content is the only input.
on:
  pull_request:
    branches-ignore: [sync]
  push:
    branches-ignore: [sync]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a branch or PR supersedes the older run; runs on `main` are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  # No remote cache, no telemetry: CI holds no secrets and talks to nobody but the registry.
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_skeleton: ${{ steps.detect.outputs.has_skeleton }}
      has_lint: ${{ steps.detect.outputs.has_lint }}
      has_typecheck: ${{ steps.detect.outputs.has_typecheck }}
      has_build: ${{ steps.detect.outputs.has_build }}
      has_test: ${{ steps.detect.outputs.has_test }}
      has_vectors_script: ${{ steps.detect.outputs.has_vectors_script }}
      needs_playwright: ${{ steps.detect.outputs.needs_playwright }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect skeleton and root scripts
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          strict=false
          if [ -f .github/ci-strict ]; then strict=true; fi

          # Missing pieces are a warning while the skeleton is being built and an
          # error once the repository opts in with .github/ci-strict.
          fail_or_warn() {
            if [ "$strict" = true ]; then
              echo "::error::$1 (strict mode: .github/ci-strict exists)"
              exit 1
            fi
            echo "::warning::$1 (skipped; commit .github/ci-strict to make this fatal)"
          }

          has_skeleton=false
          if [ -f package.json ] && [ -f pnpm-lock.yaml ]; then
            has_skeleton=true
            case "$(jq -r '.packageManager // ""' package.json)" in
              pnpm@*) ;;
              *)
                echo '::error file=package.json::package.json must pin pnpm through the "packageManager" field (for example pnpm@10.0.0).'
                exit 1
                ;;
            esac
          elif [ -f package.json ] || [ -f pnpm-lock.yaml ]; then
            fail_or_warn "package.json and pnpm-lock.yaml must be committed together"
          else
            echo "::notice::No pnpm workspace yet (docs-only repository); Node jobs are skipped."
          fi
          out has_skeleton "$has_skeleton"

          script_exists() {
            [ "$has_skeleton" = true ] && jq -e --arg s "$1" '(.scripts // {}) | has($s)' package.json > /dev/null
          }

          # check_script <output key> <root script> <required in strict mode: true|false>
          check_script() {
            if script_exists "$2"; then
              out "$1" true
            else
              out "$1" false
              if [ "$has_skeleton" = true ]; then
                if [ "$3" = true ]; then
                  fail_or_warn "Root package.json has no \"$2\" script"
                else
                  echo "::notice::Root package.json has no \"$2\" script; that step is skipped."
                fi
              fi
            fi
          }

          check_script has_lint lint true
          check_script has_typecheck typecheck true
          check_script has_build build true
          check_script has_test test true
          # Required in strict mode since M0-9: a deleted vectors:check script must not turn
          # the vectors job into a silent skip.
          check_script has_vectors_script vectors:check true

          # Browsers are only downloaded when Playwright is a root devDependency. The lockfile
          # is not a signal: it lists Playwright as an optional peer of Vitest (IR-M0-2d-1 F07).
          needs_playwright=false
          if [ "$has_skeleton" = true ] && jq -e '(.devDependencies // {}) | has("playwright") or has("@playwright/test")' package.json > /dev/null; then
            needs_playwright=true
          fi
          out needs_playwright "$needs_playwright"

  checks:
    name: checks
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        # When packages/node (better-sqlite3) lands, allow its install script explicitly:
        #   with:
        #     rebuild: better-sqlite3

      # Task ordering and caching are turbo's job; the root scripts call `turbo run ...`.
      - name: Lint
        if: needs.detect.outputs.has_lint == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.detect.outputs.has_typecheck == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.detect.outputs.has_build == 'true'
        run: pnpm build

      - name: Unit tests
        if: needs.detect.outputs.has_test == 'true'
        run: pnpm test

  vectors:
    name: vectors
    needs: detect
    if: needs.detect.outputs.has_skeleton == 'true' && needs.detect.outputs.has_vectors_script == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Requires playwright (or @playwright/test) as a root devDependency (docs/process/ci-cd.md).
      # The vectors run in all three Playwright engines (M0-9).
      - name: Install Playwright browsers
        if: needs.detect.outputs.needs_playwright == 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Python for the independent vector generators, fixed at the version requirements.txt was
      # compiled for (every pinned package has a cp312 wheel), whatever ubuntu-latest ships.
      - name: Set up Python for the vector generators
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The generators' pinned Python packages (M1-1h): every package, transitive ones included, is
      # pinned with hashes; wheels only (no sdist build code runs) and no dependency resolution.
      - name: Install the vector generators' pinned Python packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/vectors-py"
          "$RUNNER_TEMP/vectors-py/bin/python" -m pip install --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps -r tools/vectors/requirements.txt
          echo "VECTORS_PYTHON=$RUNNER_TEMP/vectors-py/bin/python" >> "$GITHUB_ENV"

      # Provenance: every committed vector file must equal the output of the independent generator
      # it names (a script under tools/vectors/, run in `--check FILE` mode, which writes nothing).
      - name: Check committed vectors against their independent generators
        run: node tools/vectors/check-generators.mjs

      # Pending suites (vectors before their code, M1-1h) may only shrink against main: a suite
      # that was implemented on main can never become pending again (IR-M1-1h-1 F2).
      - name: Check that pending vector suites only shrink against main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node tools/vectors/check-pending.mjs --base origin/main

      # Crypto + EIP-712 vectors across Node, browsers (Playwright) and Workers (workerd).
      - name: Check test vectors across runtimes
        run: pnpm vectors:check

      # Vectors come from an independent generator and are committed; tests only read them
      # (docs/process/development-process.md §10). Independent of the runner's own check.
      - name: Fail if the run created or changed anything under test-vectors/
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain --untracked-files=all -- test-vectors)"
          if [ -n "$changes" ]; then
            # Paths are not echoed (they could carry workflow commands); the runner's own output names them.
            echo "::error::The vector run wrote to test-vectors/ ($(printf '%s\n' "$changes" | wc -l | tr -d ' ') path(s)). Tests must never write or regenerate vector files."
            exit 1
          fi

  # AGENTS.md and CLAUDE.md are auto-loaded into every agent session, so they have hard
  # size budgets to keep context lean. Plain shell, no Node skeleton needed: this job runs
  # on a docs-only repository too and does not depend on `detect`. A missing file passes.
  context-budget:
    name: context-budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check auto-loaded context files against their byte budgets
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          # check_budget <file> <max bytes>
          check_budget() {
            local file="$1" budget="$2" size
            if [ ! -f "$file" ]; then
              echo "::notice::$file does not exist; nothing to check."
              return 0
            fi
            size="$(wc -c < "$file" | tr -d '[:space:]')"
            if [ "$size" -gt "$budget" ]; then
              echo "::error file=$file::$file is $size bytes, over its budget of $budget bytes (over by $((size - budget)) bytes). It is auto-loaded into every agent session: move detail into docs/ and link to it."
              failed=1
            else
              echo "$file: $size of $budget bytes (ok)"
            fi
          }

          check_budget AGENTS.md 8192
          check_budget CLAUDE.md 1024

          exit "$failed"

  ci-gate:
    # A push run on a feature branch tests the branch tip, while the pull request run tests the
    # merge with `main`. Only the latter may satisfy the required check `ci-gate`, so a feature
    # branch push publishes `ci-gate (push)` instead.
    name: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'ci-gate (push)' || 'ci-gate' }}
    needs: [detect, checks, vectors, context-budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every upstream job to have succeeded or been skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::An upstream job ended as '$result'."
                exit 1
                ;;
            esac
          done
