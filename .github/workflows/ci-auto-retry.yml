# CI auto-retry (CHORE-CI-AUTORETRY): when a CI or Security run fails on its first attempt only in
# flaky-prone jobs, rerun its failed jobs once, so an approved PR does not wait for a human rerun.
#
# Security posture: `workflow_run` runs this file from the default branch in the base repository,
# with a token that can write Actions state. So this workflow never checks out or executes code
# from the run it looks at: it checks out only `tools/ci/auto-retry.mjs` at `github.sha` (the
# default branch head for this event), runs it with the runner's Node (no install), and calls the
# GitHub API with the numeric run id from the event payload, passed through `env:` and validated.
# Only runs from this repository are retried (no forks), only attempt 1 (no loops), never a
# cancelled run, never a merge-queue run (a failed queue run has already ejected the pull request).
# Mixed jobs (for example `checks`: lint, typecheck, build, unit tests) qualify only by failed step. Rules: tools/ci/auto-retry.mjs and docs/process/ci-cd.md.
name: CI auto-retry

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no checkout or execution of the triggering run's code; API calls with a validated numeric run id only
    workflows: [CI, Security]
    types: [completed]

permissions: {}

concurrency:
  group: ci-auto-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-flaky:
    name: rerun-flaky
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the decision script from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/ci/auto-retry.mjs
          sparse-checkout-cone-mode: false

      - name: List the jobs and failed steps of the failed attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::Run id is not a positive integer."
            exit 1
          fi
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" \
            --jq '.jobs[] | {name, conclusion, failedSteps: [(.steps // [])[] | select(.conclusion == "failure") | .name]} | tojson' > "$RUNNER_TEMP/auto-retry-jobs.jsonl"

      - name: Decide
        id: decide
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          JOBS_FILE="$RUNNER_TEMP/auto-retry-jobs.jsonl" node tools/ci/auto-retry.mjs

      - name: Rerun the failed jobs once
        if: steps.decide.outputs.rerun == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::Run id is not a positive integer."
            exit 1
          fi
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
          echo "Rerun requested for run $RUN_ID (failed jobs and their dependents)." >> "$GITHUB_STEP_SUMMARY"
