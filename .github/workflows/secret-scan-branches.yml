# Secret scan of every branch other than main and sync (gitleaks, through secret-scan.yml).
#
# - On a push to a branch: scans the commits reachable from that branch only. A secret on one
#   branch fails that branch's own run (and the pull request that contains it, through the
#   security.yml run on the PR); it never turns an unrelated branch, pull request or main red.
#   main is scanned by security.yml and `sync` by its stub (docs/process/ci-cd.md).
# - Daily: scans every branch and tag of the repository. The run is red when anything anywhere
#   contains a secret; that red run is the alert. It gates nothing.
#
# Not a required check. No secrets, read-only token.
name: Secret scan (branches)

on:
  push:
    branches-ignore: [main, sync]
  schedule:
    - cron: "41 4 * * *"

permissions: {}

concurrency:
  group: secret-scan-branches-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  secret-scan-branch:
    name: secret-scan-branch
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yml
    with:
      scope: ${{ github.event_name == 'schedule' && 'all' || 'ref' }}
