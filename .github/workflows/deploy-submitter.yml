# Deploy the 4thTech submitter Worker and its testnet credits faucet (apps/submitter, 07 §7, 05 §9;
# M1-10c, D-28, D-88): staging on every merge to main, production automatically once the staging
# smoke test is green (D-25, D-52). Mirrors deploy-drop.yml (M1-27b), the first proven Worker
# pipeline. Contract: docs/process/release-and-deployment.md §4.5 (Workers pipeline), §6 (secrets),
# §8 (rollback). Configuration: apps/submitter/wrangler.toml. Owner steps:
# docs/runbooks/submitter-deploy.md. Tests of this file: tools/release/deploy-submitter.test.mjs
# (structure, the marked bash blocks on fakes) and apps/submitter/test/smoke-config.test.ts
# (wrangler.toml).
#
# Every wrangler call runs in apps/submitter and passes `--config wrangler.toml` explicitly. Wrangler
# looks for its config next to a positional script path, not in the working directory, so a prebuilt
# `wrangler deploy <bundle>/index.js --no-bundle` without it ignores [env.*] (M1-27b-b).
#
# JOBS
#   ci-green           waits for this commit's ci.yml and security.yml gates (as release.yml).
#   guard              main of 4thtech/agentlink only, and only once apps/submitter/wrangler.toml exists.
#   build              builds the Worker bundle ONCE (wrangler deploy --dry-run, no credentials) and
#                      uploads it with its SHA-256; both environments deploy exactly these bytes.
#   deploy-staging     environment `staging`. Skips cleanly (green, with a notice) while the
#                      Cloudflare credentials or any required Worker secret are missing. Deploys to
#                      workers.dev, then reads back the logging settings.
#   smoke-staging      no credentials: /v1/health with every chain available; a simulated notarize on
#                      each served chain (a fresh agent with no credits and maxFee 0: the Notary's
#                      simulation reverts, nothing is sent, no gas is spent); the faucet refuses a
#                      mainnet chain ID (apps/submitter/test/smoke-remote.test.ts).
#   deploy-production  environment `production`, only after a green staging smoke, and only while this
#                      commit is still main's head. Records the live version (rollback target),
#                      deploys to the Custom Domain, health-checks over HTTP (no repository code runs
#                      against production), reads back the logging settings, and on any failure rolls
#                      back automatically with `wrangler rollback`. Writes the deploy record draft to
#                      the run summary. The health check waits up to 15 minutes while there is no TLS
#                      or connection yet (a new Custom Domain's certificate); an unhealthy HTTP answer
#                      fails after 10 attempts. A rollback Cloudflare refuses across a binding or
#                      storage change is reported as impossible: the new version stays live.
#   freeze             sets DEPLOY_FREEZE when deploy-production failed after deploying; fails loudly,
#                      naming the owner fix, when its token cannot set the variable.
#   rollback-rehearsal manual dispatch with `rehearse-rollback`: on staging, rolls back to the
#                      previous version, checks it, and rolls forward again (§4.5 "rehearsed").
#
# SKIPPING VS FAILING: absent credentials, an absent Worker or an absent required Worker secret skip
# with a notice; a token the API refuses fails the job. The wrangler.toml vars (SUBMITTER_CHAINS,
# SUBMITTER_FAUCET_CHAINS) are reviewed in PRs; a Worker secret of the same name fails the job (it
# would shadow the reviewed value).
#
# DEPLOY_FREEZE: every deploy job is skipped while the repository variable is 'true' and re-checks it
# when it starts (after any approval wait). Rollback is remediation and still runs.
#
# CREDENTIALS (owner only; never in this file, logs or PR text)
#   Environment `staging`:    secret CLOUDFLARE_API_TOKEN (staging token), variable CLOUDFLARE_ACCOUNT_ID,
#                             optional variable SUBMITTER_STAGING_URL (the workers.dev origin, used only
#                             if Wrangler does not report it).
#   Environment `production`: secret CLOUDFLARE_API_TOKEN (production token), variable CLOUDFLARE_ACCOUNT_ID.
#   Environment `deploy-freeze`: secret DEPLOY_FREEZE_TOKEN (exists, OPS-CI-2).
#   The gas, faucet and IP-bucket keys (SUBMITTER_REQUIRED_SECRETS below) and the optional RPC URLs
#   are Worker secrets, set per environment by the owner with `wrangler secret put`. GitHub never
#   holds them; this workflow only lists their NAMES through the Cloudflare API, never a value.
#
# Zero access (AGENTS.md, I-7): no step prints a key, a token, an RPC URL or the health answer (it
# carries gas balances). Only the submitter's origin, HTTP status codes, fixed error codes and Worker
# version IDs appear in logs.
name: Deploy submitter

on:
  push:
    branches: [main]
    paths:
      - "apps/submitter/**"
      - "packages/chain/**"
      - "packages/crypto/**"
      - "packages/occ-v2-abi/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".nvmrc"
      - ".github/actions/setup-node-pnpm/**"
      # Every repo-local script a step runs (tools/release/deploy-path-triggers.test.mjs).
      - ".github/scripts/worker-logging-settings.jq"
      - "tools/release/wait-for-ci.mjs"
      - ".github/workflows/deploy-submitter.yml"
  workflow_dispatch:
    inputs:
      rehearse-rollback:
        description: "After the staging deploy and smoke: roll staging back to the previous version, check it, roll forward."
        type: boolean
        default: false

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  WRANGLER_SEND_METRICS: "false"
  # The production hostname (release-and-deployment.md §1.1, D-28); also the route in
  # apps/submitter/wrangler.toml.
  SUBMITTER_PRODUCTION_ORIGIN: https://submit.agentlink.4thtech.io
  # Worker secrets the deploy waits for, by NAME only, in both environments: the IP-bucket key, then a
  # gas key per SUBMITTER_CHAINS entry and a faucet key per SUBMITTER_FAUCET_CHAINS entry of
  # wrangler.toml (tools/release/deploy-submitter.test.mjs keeps the two in step).
  SUBMITTER_REQUIRED_SECRETS: "SUBMITTER_IP_KEY SUBMITTER_GAS_KEY_84532 SUBMITTER_FAUCET_KEY_84532"
  # The wrangler.toml vars: a Worker secret with one of these names fails the deploy.
  SUBMITTER_SHADOW_VARS: "SUBMITTER_CHAINS SUBMITTER_FAUCET_CHAINS"

jobs:
  ci-green:
    name: ci-green
    if: github.repository == '4thtech/agentlink' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for this commit's CI and require it green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/release/wait-for-ci.mjs \
            --require ci.yml:ci-gate \
            --require security.yml:security-gate \
            --timeout-minutes 45 \
            --interval-seconds 30 \
            --missing-grace-minutes 10

  guard:
    name: guard
    needs: ci-green
    if: github.repository == '4thtech/agentlink' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the submitter has a deploy configuration
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/submitter/wrangler.toml ] && [ -f apps/submitter/src/index.ts ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/submitter/wrangler.toml not found; nothing to deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # no credentials in this job: build code never sees a deploy token
    outputs:
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Build the workspace dependencies of @4thtech-io/submitter
        run: pnpm exec turbo run build --filter='@4thtech-io/submitter...'

      # --dry-run bundles without contacting Cloudflare. The bundle is the same for both
      # environments (no `define` or build-time vars differ); --env only selects the config to validate.
      - name: Bundle the Worker once
        id: bundle
        shell: bash
        working-directory: apps/submitter
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/submitter-bundle"
          rm -rf "$out"
          pnpm exec wrangler deploy --dry-run --env production --config wrangler.toml --outdir "$out"
          if [ ! -f "$out/index.js" ]; then
            echo "::error::The bundle has no index.js."
            exit 1
          fi
          sha="$(sha256sum "$out/index.js" | cut -d' ' -f1)"
          echo "Bundle index.js sha256 $sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: submitter-bundle
          path: ${{ runner.temp }}/submitter-bundle/index.js
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: deploy-staging
    needs: [guard, build]
    if: needs.guard.outputs.enabled == 'true' && vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: deploy-submitter-staging
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      url: ${{ steps.deploy.outputs.url }}
      version: ${{ steps.deploy.outputs.version }}
      previous: ${{ steps.previous.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stop if DEPLOY_FREEZE is set
        shell: bash
        env:
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_FREEZE:-}" = "true" ]; then
            echo "::error::DEPLOY_FREEZE is set; nothing is deployed until the owner clears it."
            exit 1
          fi

      # No pnpm store cache in a job that holds secrets (cache poisoning).
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submitter-bundle
          path: ${{ runner.temp }}/submitter-bundle

      - name: Verify the bundle is the one built
        shell: bash
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/submitter-bundle"
          echo "${EXPECTED}  index.js" | sha256sum -c -

      - name: Check credentials and the Worker secrets
        id: ready
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: staging
          WORKER: agentlink-submitter-staging
          REQUIRED_SECRETS: ${{ env.SUBMITTER_REQUIRED_SECRETS }}
          SHADOW_VARS: ${{ env.SUBMITTER_SHADOW_VARS }}
        run: |
          set -euo pipefail
          # SECRET-CHECK-BEGIN
          # Absent credentials or absent Worker secrets skip cleanly; a token that does not work fails.
          if [ -z "${REQUIRED_SECRETS:-}" ]; then
            echo "::error::No required Worker secrets are listed (SUBMITTER_REQUIRED_SECRETS)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Environment $DEPLOY_ENV has no CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID yet (owner steps, docs/runbooks/submitter-deploy.md). Not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID."
            exit 1
          fi
          listing="$RUNNER_TEMP/secret-names.json"
          # Names only: the API never returns secret values.
          code="$(curl -sS --proto '=https' --max-time 30 -o "$listing" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/secrets" || true)"
          case "$code" in
            200) ;;
            404)
              echo "::notice::Worker $WORKER does not exist yet (owner: wrangler secret put creates it). Not deployed."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Listing the secrets of $WORKER failed with HTTP ${code:-none}: the token is invalid, expired or lacks Workers Scripts access."
              exit 1
              ;;
          esac
          if ! jq -e '.success == true and (.result | type == "array")' "$listing" > /dev/null 2>&1; then
            echo "::error::The secrets listing of $WORKER is not a valid API response."
            exit 1
          fi
          for name in $SHADOW_VARS; do
            if jq -e --arg n "$name" 'any(.result[]; .name == $n)' "$listing" > /dev/null; then
              echo "::error::$WORKER has a Worker secret $name; it is a reviewed wrangler.toml var. Owner: wrangler secret delete $name --env $DEPLOY_ENV."
              exit 1
            fi
          done
          missing=""
          for name in $REQUIRED_SECRETS; do
            if ! jq -e --arg n "$name" 'any(.result[]; .name == $n)' "$listing" > /dev/null; then
              missing="${missing:+$missing }$name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Worker secrets not set on $WORKER yet: $missing (owner: wrangler secret put, docs/runbooks/submitter-deploy.md). Not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # SECRET-CHECK-END

      - name: Record the live version (rollback rehearsal target)
        id: previous
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          version=""
          if status="$(pnpm exec wrangler deployments status --env staging --config wrangler.toml --json)"; then
            json="$(printf '%s\n' "$status" | awk 'f || /^\{/ { f = 1; print }')"
            version="$(jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' <<<"$json" || true)"
          fi
          if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then version=""; fi
          echo "Live staging version before deploy: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to staging (workers.dev)
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUBMITTER_STAGING_URL: ${{ vars.SUBMITTER_STAGING_URL }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/wrangler-staging.ndjson"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          WRANGLER_OUTPUT_FILE_PATH="$report" pnpm exec wrangler deploy "$RUNNER_TEMP/submitter-bundle/index.js" --no-bundle --env staging --config wrangler.toml
          url="$(jq -r 'select(.type == "deploy") | .targets[]?' "$report" | grep -E '^https://[a-z0-9.-]+\.workers\.dev$' | head -n 1 || true)"
          if [ -z "$url" ]; then url="${SUBMITTER_STAGING_URL:-}"; fi
          if ! [[ "$url" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::No staging origin: Wrangler reported no workers.dev URL and the variable SUBMITTER_STAGING_URL is not set."
            exit 1
          fi
          version="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$report" | head -n 1)"
          if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then version=""; fi
          echo "Staging origin $url, version ${version:-unknown}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch the live Worker settings
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS --proto '=https' --max-time 30 -H "$auth" \
            -o "$RUNNER_TEMP/settings.json" "$api/workers/scripts/agentlink-submitter-staging/script-settings"

      - name: Read back the logging settings (all off, 07 §7)
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          SETTINGS_JSON: ${{ runner.temp }}/settings.json
        run: |
          set -euo pipefail
          # READBACK-SETTINGS-BEGIN
          # Fails closed (IR-OPS-PRIV-1-1). The conditions live in one jq program shared by every copy
          # of this block in deploy-submitter.yml and deploy-drop.yml (see its header): it prints exactly
          # `logging-settings: ok`, or one line per failed condition with only our own field paths, JSON
          # types and boolean, number or null values (never the body, strings, URLs, tokens or IDs).
          # Anything but that one ok line, including a jq error or a body that is not one JSON document,
          # fails the deploy.
          program="$GITHUB_WORKSPACE/.github/scripts/worker-logging-settings.jq"
          if ! report="$(jq -r -f "$program" "$SETTINGS_JSON" 2> /dev/null)"; then
            report="failed response: not one readable JSON document, or the check could not run"
          fi
          if [ "$report" != "logging-settings: ok" ]; then
            echo "::error::The live Worker settings are not all off: Logpush, observability, invocation logs, traces, log or trace export and Tail Workers (also streaming) must stay off for the submitter (07 §7, I-7). Failed conditions follow."
            printf '%s\n' "$report"
            exit 1
          fi
          echo "Logging settings read back: Logpush, observability, invocation logs, traces, export destinations and Tail Workers are off."
          # READBACK-SETTINGS-END

  smoke-staging:
    name: smoke-staging
    needs: deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true' && needs.deploy-staging.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # no credentials: a fresh random agent key per step
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Build the workspace dependencies of @4thtech-io/submitter
        run: pnpm exec turbo run build --filter='@4thtech-io/submitter^...'

      - name: Health per chain, a simulated notarize per chain, the faucet refuses a mainnet chain
        shell: bash
        working-directory: apps/submitter
        env:
          SUBMITTER_SMOKE_URL: ${{ needs.deploy-staging.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${SUBMITTER_SMOKE_URL:-}" ]; then
            echo "::error::No staging origin from deploy-staging."
            exit 1
          fi
          pnpm exec vitest run --project submitter-smoke-remote

  deploy-production:
    name: deploy-production
    needs: [build, deploy-staging, smoke-staging]
    if: needs.deploy-staging.outputs.deployed == 'true' && needs.smoke-staging.result == 'success' && vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-24.04
    # The health check alone may wait 20 minutes for a new Custom Domain's certificate (M1-27b-c).
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-submitter-production
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      rollback: ${{ steps.rollback.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Re-checked here: the environment may have waited for an approval click.
      - name: Stop if DEPLOY_FREEZE is set
        shell: bash
        env:
          DEPLOY_FREEZE: ${{ vars.DEPLOY_FREEZE }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_FREEZE:-}" = "true" ]; then
            echo "::error::DEPLOY_FREEZE is set; nothing is deployed until the owner clears it."
            exit 1
          fi

      - name: Check that this commit is still the head of main
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # HEAD-CHECK-BEGIN
          # Runs can finish out of order: only the run for main's current head may change production.
          head="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not read the head of main."
            exit 1
          fi
          if [ "$head" != "$COMMIT" ]; then
            echo "::notice::main has moved on from $COMMIT to $head; the newer run handles production. Skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
          # HEAD-CHECK-END

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: submitter-bundle
          path: ${{ runner.temp }}/submitter-bundle

      - name: Verify the bundle is the one staging ran
        shell: bash
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/submitter-bundle"
          echo "${EXPECTED}  index.js" | sha256sum -c -

      - name: Check credentials and the Worker secrets
        id: ready
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: production
          WORKER: agentlink-submitter
          REQUIRED_SECRETS: ${{ env.SUBMITTER_REQUIRED_SECRETS }}
          SHADOW_VARS: ${{ env.SUBMITTER_SHADOW_VARS }}
        run: |
          set -euo pipefail
          # SECRET-CHECK-BEGIN
          # Absent credentials or absent Worker secrets skip cleanly; a token that does not work fails.
          if [ -z "${REQUIRED_SECRETS:-}" ]; then
            echo "::error::No required Worker secrets are listed (SUBMITTER_REQUIRED_SECRETS)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice::Environment $DEPLOY_ENV has no CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID yet (owner steps, docs/runbooks/submitter-deploy.md). Not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID."
            exit 1
          fi
          listing="$RUNNER_TEMP/secret-names.json"
          # Names only: the API never returns secret values.
          code="$(curl -sS --proto '=https' --max-time 30 -o "$listing" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/secrets" || true)"
          case "$code" in
            200) ;;
            404)
              echo "::notice::Worker $WORKER does not exist yet (owner: wrangler secret put creates it). Not deployed."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Listing the secrets of $WORKER failed with HTTP ${code:-none}: the token is invalid, expired or lacks Workers Scripts access."
              exit 1
              ;;
          esac
          if ! jq -e '.success == true and (.result | type == "array")' "$listing" > /dev/null 2>&1; then
            echo "::error::The secrets listing of $WORKER is not a valid API response."
            exit 1
          fi
          for name in $SHADOW_VARS; do
            if jq -e --arg n "$name" 'any(.result[]; .name == $n)' "$listing" > /dev/null; then
              echo "::error::$WORKER has a Worker secret $name; it is a reviewed wrangler.toml var. Owner: wrangler secret delete $name --env $DEPLOY_ENV."
              exit 1
            fi
          done
          missing=""
          for name in $REQUIRED_SECRETS; do
            if ! jq -e --arg n "$name" 'any(.result[]; .name == $n)' "$listing" > /dev/null; then
              missing="${missing:+$missing }$name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::Worker secrets not set on $WORKER yet: $missing (owner: wrangler secret put, docs/runbooks/submitter-deploy.md). Not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          # SECRET-CHECK-END

      - name: Record the live version (rollback target)
        id: previous
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          version=""
          if status="$(pnpm exec wrangler deployments status --env production --config wrangler.toml --json)"; then
            json="$(printf '%s\n' "$status" | awk 'f || /^\{/ { f = 1; print }')"
            version="$(jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' <<<"$json" || true)"
          fi
          if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then
            version=""
            echo "::warning::No single live production version recorded; an automatic rollback will not be possible for this deploy."
          fi
          echo "Rollback target: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to production (Custom Domain)
        id: deploy
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/wrangler-production.ndjson"
          # Set first: a deploy that fails half-way still counts as deployed (rollback, freeze).
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          WRANGLER_OUTPUT_FILE_PATH="$report" pnpm exec wrangler deploy "$RUNNER_TEMP/submitter-bundle/index.js" --no-bundle --env production --config wrangler.toml
          version="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$report" | head -n 1)"
          if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then version=""; fi
          echo "Production version ${version:-unknown}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # HTTP only; no repository code runs against production. Healthy: /v1/health answers 200 with
      # `ok: true` and every served chain available (its gas key loaded and its balance read over
      # RPC), and an empty notarize answers 400 (the Worker loaded its settings; a missing or invalid
      # SUBMITTER_IP_KEY answers 503). The health answer carries gas balances: parsed, never printed.
      # No HTTP answer at all (HTTP 000: TLS, DNS or connection failure) keeps retrying for up to
      # 15 minutes while a new Custom Domain's certificate is provisioned (M1-27b-c).
      - name: Health check
        id: health
        if: steps.ready.outputs.ready == 'true'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # HEALTH-CHECK-BEGIN
          answer_limit=10    # attempts with a real HTTP answer that is not the healthy pair
          connect_limit=60   # attempts in all (15 s apart)
          connect_window=900 # seconds without TLS or a connection (curl exit 35, 6, 7: HTTP 000)
          started=$SECONDS
          answered=0
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            rm -f "$RUNNER_TEMP/health.json"
            health_exit=0
            health="$(curl -sS --proto '=https' --max-time 15 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "$SUBMITTER_PRODUCTION_ORIGIN/v1/health")" || health_exit=$?
            config_exit=0
            config="$(curl -sS --proto '=https' --max-time 15 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' "$SUBMITTER_PRODUCTION_ORIGIN/v1/notarize")" || config_exit=$?
            if [ "$health" = "200" ] && jq -e '
              .ok == true
              and (.chains | type == "array" and length > 0)
              and all(.chains[]; .available == true)
            ' "$RUNNER_TEMP/health.json" > /dev/null 2>&1 && [ "$config" = "400" ]; then
              echo "Healthy: /v1/health 200 with every chain available, empty notarize 400 (attempt $attempt)."
              exit 0
            fi
            if [[ "$health" =~ ^[1-5][0-9][0-9]$ ]] || [[ "$config" =~ ^[1-5][0-9][0-9]$ ]]; then
              answered=$((answered + 1))
              if [ "$answered" -ge "$answer_limit" ]; then
                echo "::error::The production health check failed: /v1/health $health (ok and every chain available required), empty notarize $config after $answered attempts that got an HTTP answer."
                exit 1
              fi
              echo "Attempt $attempt: /v1/health $health, empty notarize $config; not healthy yet, retrying in 15 s."
            else
              elapsed=$((SECONDS - started))
              if [ "$attempt" -ge "$connect_limit" ] || [ "$elapsed" -ge "$connect_window" ]; then
                echo "::error::The production health check failed: no TLS or connection to $SUBMITTER_PRODUCTION_ORIGIN after $attempt attempts ($elapsed s; curl exit $health_exit and $config_exit). Check the Custom Domain and its edge certificate in the Cloudflare dashboard."
                exit 1
              fi
              echo "Attempt $attempt: no TLS or connection yet (curl exit $health_exit and $config_exit, HTTP ${health:-000} and ${config:-000}); a new Custom Domain's certificate can take minutes. Retrying in 15 s."
            fi
            sleep 15
          done
          # HEALTH-CHECK-END

      - name: Fetch the live Worker settings
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS --proto '=https' --max-time 30 -H "$auth" \
            -o "$RUNNER_TEMP/settings.json" "$api/workers/scripts/agentlink-submitter/script-settings"

      - name: Read back the logging settings (all off, 07 §7)
        id: settings
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          SETTINGS_JSON: ${{ runner.temp }}/settings.json
        run: |
          set -euo pipefail
          # READBACK-SETTINGS-BEGIN
          # Fails closed (IR-OPS-PRIV-1-1). The conditions live in one jq program shared by every copy
          # of this block in deploy-submitter.yml and deploy-drop.yml (see its header): it prints exactly
          # `logging-settings: ok`, or one line per failed condition with only our own field paths, JSON
          # types and boolean, number or null values (never the body, strings, URLs, tokens or IDs).
          # Anything but that one ok line, including a jq error or a body that is not one JSON document,
          # fails the deploy.
          program="$GITHUB_WORKSPACE/.github/scripts/worker-logging-settings.jq"
          if ! report="$(jq -r -f "$program" "$SETTINGS_JSON" 2> /dev/null)"; then
            report="failed response: not one readable JSON document, or the check could not run"
          fi
          if [ "$report" != "logging-settings: ok" ]; then
            echo "::error::The live Worker settings are not all off: Logpush, observability, invocation logs, traces, log or trace export and Tail Workers (also streaming) must stay off for the submitter (07 §7, I-7). Failed conditions follow."
            printf '%s\n' "$report"
            exit 1
          fi
          echo "Logging settings read back: Logpush, observability, invocation logs, traces, export destinations and Tail Workers are off."
          # READBACK-SETTINGS-END

      # Any failure after the deploy started rolls back. Durable Object migrations are forward-only
      # (§4.5): Cloudflare refuses a version that depends on a binding or storage this deploy changed
      # (seen on the drop's first production deploy, M1-27b-c). The step then reports that the new
      # version stays live, the freeze stops everything and the owner decides the forward fix.
      # No head-of-main gate here: the production concurrency group serializes runs, so the version
      # this run deployed is live and must be rolled back even if main moved on.
      - name: Roll back to the recorded version
        id: rollback
        if: (failure() || cancelled()) && steps.deploy.outputs.deployed == 'true'
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # ROLLBACK-BEGIN
          if [ -z "${PREVIOUS:-}" ]; then
            echo "::error::No recorded rollback target. DEPLOY_FREEZE is set by the freeze job; the owner decides the fix."
            echo "result=no-target" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if rolled="$(pnpm exec wrangler rollback "$PREVIOUS" --env production --config wrangler.toml --message "Automatic rollback after a failed post-deploy check (run $RUN_ID)" --yes 2>&1)"; then
            printf '%s\n' "$rolled"
          else
            printf '%s\n' "$rolled"
            if grep -qiE 'resource that was modified|cannot be deployed because' <<<"$rolled"; then
              message="Rollback impossible across a binding/storage change: Cloudflare refuses $PREVIOUS because it depends on a Durable Object or binding that this deploy changed. The new version stays live; DEPLOY_FREEZE is set by the freeze job; owner action required (forward fix, release-and-deployment.md §8)."
              echo "::error::$message"
              echo "result=impossible-binding-change" >> "$GITHUB_OUTPUT"
              {
                echo "### Rollback"
                echo
                echo "$message"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::error::wrangler rollback to $PREVIOUS failed; the new version may still be live. DEPLOY_FREEZE is set by the freeze job; owner action required."
            echo "result=rollback-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          live="$(pnpm exec wrangler deployments status --env production --config wrangler.toml --json \
            | awk 'f || /^\{/ { f = 1; print }' \
            | jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty' || true)"
          if [ "$live" != "$PREVIOUS" ]; then
            echo "::error::After the rollback the live version is ${live:-unknown}, not $PREVIOUS."
            echo "result=rollback-not-live" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          for _ in 1 2 3 4 5 6; do
            health="$(curl -sS --proto '=https' --max-time 15 -o /dev/null -w '%{http_code}' "$SUBMITTER_PRODUCTION_ORIGIN/v1/health" || true)"
            if [ "$health" = "200" ]; then
              echo "::warning::Rolled back: $PREVIOUS is live and /v1/health answers 200. DEPLOY_FREEZE is set by the freeze job."
              echo "result=rolled-back" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Rolled back: $PREVIOUS is live, but /v1/health does not answer 200."
          echo "result=rolled-back-unhealthy" >> "$GITHUB_OUTPUT"
          exit 1
          # ROLLBACK-END

      - name: Write the deploy record draft
        if: always() && steps.deploy.outputs.deployed == 'true'
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BUNDLE_SHA256: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS: ${{ steps.previous.outputs.version }}
          STAGING_VERSION: ${{ needs.deploy-staging.outputs.version }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          HEALTH_RESULT: ${{ steps.health.outcome }}
          SETTINGS_RESULT: ${{ steps.settings.outcome }}
          ROLLBACK_RESULT: ${{ steps.rollback.outputs.result }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy record draft (submitter and faucet Worker)"
            echo
            echo "No secrets here. The orchestrator files the final record in 4thtech/agentlink-ops (release-and-deployment.md §5.2)."
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | Worker \`agentlink-submitter\` (apps/submitter), bundle \`index.js\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Environment | production ($SUBMITTER_PRODUCTION_ORIGIN), testnet beta (D-88) |"
            echo "| Time (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| Approved | the \`production\` environment's rule at run time (none once the owner removed the reviewer, D-52); see the run |"
            echo "| Executed by | CI run $RUN_URL |"
            echo "| Bundle sha256 | \`$BUNDLE_SHA256\` (the same bytes as staging version \`${STAGING_VERSION:-unknown}\`) |"
            echo "| Version deployed | \`${VERSION:-unknown}\` (deploy: $DEPLOY_RESULT) |"
            echo "| Rollback target | \`${PREVIOUS:-none}\` |"
            echo "| Health check | ${HEALTH_RESULT:-skipped} |"
            echo "| Logging read-back | ${SETTINGS_RESULT:-skipped} |"
            echo "| Rollback | ${ROLLBACK_RESULT:-not needed} |"
          } >> "$GITHUB_STEP_SUMMARY"

  freeze:
    name: freeze
    needs: deploy-production
    if: >-
      always() && vars.DEPLOY_FREEZE != 'true' &&
      needs.deploy-production.outputs.deployed == 'true' && needs.deploy-production.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-freeze
    permissions: {}
    steps:
      - name: Set DEPLOY_FREEZE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_FREEZE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ROLLBACK_RESULT: ${{ needs.deploy-production.outputs.rollback }}
        run: |
          set -euo pipefail
          # FREEZE-BEGIN
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::DEPLOY_FREEZE_TOKEN is not configured. The orchestrator or the owner sets DEPLOY_FREEZE=true now (release-and-deployment.md §3.1)."
            echo "- **DEPLOY_FREEZE is NOT set**: DEPLOY_FREEZE_TOKEN is not configured. Set DEPLOY_FREEZE=true now." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! failure="$(gh variable set DEPLOY_FREEZE --body true --repo "$REPOSITORY" 2>&1)"; then
            failure="$(printf '%s' "$failure" | head -n 3 | tr '\n' ' ')"
            echo "::error::Setting DEPLOY_FREEZE failed (${failure:-no output}); DEPLOY_FREEZE is NOT set. Owner fix: the token behind the secret DEPLOY_FREEZE_TOKEN (environment deploy-freeze) needs Variables: read and write on 4thtech/agentlink. Until then the orchestrator or the owner sets DEPLOY_FREEZE=true by hand (release-and-deployment.md §3.1). Rollback: ${ROLLBACK_RESULT:-none}."
            {
              echo "### DEPLOY_FREEZE is NOT set"
              echo
              echo "Setting it failed: ${failure:-no output}. Owner fix: the token behind the secret DEPLOY_FREEZE_TOKEN needs Variables: read and write on 4thtech/agentlink. Set DEPLOY_FREEZE=true by hand now. Rollback: ${ROLLBACK_RESULT:-none}."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::error::The submitter's production deploy failed after deploying. DEPLOY_FREEZE is set; only the owner clears it. Rollback: ${ROLLBACK_RESULT:-none}."
          echo "DEPLOY_FREEZE is set after a failed production deploy of the submitter (rollback: ${ROLLBACK_RESULT:-none}); only the owner clears it." >> "$GITHUB_STEP_SUMMARY"
          exit 1
          # FREEZE-END

  rollback-rehearsal:
    name: rollback-rehearsal
    needs: [deploy-staging, smoke-staging]
    if: inputs.rehearse-rollback && needs.smoke-staging.result == 'success' && vars.DEPLOY_FREEZE != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: deploy-submitter-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"

      - name: Roll staging back, check it, roll forward
        shell: bash
        working-directory: apps/submitter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS: ${{ needs.deploy-staging.outputs.previous }}
          CURRENT: ${{ needs.deploy-staging.outputs.version }}
          ORIGIN: ${{ needs.deploy-staging.outputs.url }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIOUS:-}" ] || [ -z "${CURRENT:-}" ] || [ "$PREVIOUS" = "$CURRENT" ]; then
            echo "::error::Staging has no distinct previous version to rehearse with (deploy twice first)."
            exit 1
          fi
          live() {
            pnpm exec wrangler deployments status --env staging --config wrangler.toml --json \
              | awk 'f || /^\{/ { f = 1; print }' \
              | jq -r '[.versions[]? | select(.percentage == 100) | .version_id][0] // empty'
          }
          healthy() {
            for _ in 1 2 3 4 5 6; do
              code="$(curl -sS --proto '=https' --max-time 15 -o /dev/null -w '%{http_code}' "$ORIGIN/v1/health" || true)"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 10
            done
            return 1
          }
          pnpm exec wrangler rollback "$PREVIOUS" --env staging --config wrangler.toml --message "Rollback rehearsal (back)" --yes
          [ "$(live)" = "$PREVIOUS" ] || { echo "::error::Staging does not serve the previous version after the rollback."; exit 1; }
          healthy || { echo "::error::Staging is unhealthy after the rollback."; exit 1; }
          echo "Rolled back to $PREVIOUS: live and healthy."
          pnpm exec wrangler rollback "$CURRENT" --env staging --config wrangler.toml --message "Rollback rehearsal (forward)" --yes
          [ "$(live)" = "$CURRENT" ] || { echo "::error::Staging does not serve the current version after rolling forward."; exit 1; }
          healthy || { echo "::error::Staging is unhealthy after rolling forward."; exit 1; }
          echo "Rolled forward to $CURRENT: live and healthy."
          {
            echo "## Rollback rehearsal (staging)"
            echo
            echo "Back to \`$PREVIOUS\` and forward to \`$CURRENT\`; both live and healthy. Recorded for M1-10c acceptance (§4.5, §8)."
          } >> "$GITHUB_STEP_SUMMARY"
