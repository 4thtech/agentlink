# Secret scan of the git history with gitleaks (reusable workflow).
#
# Scope (input `scope`): `ref` scans every commit reachable from the checked-out ref only, so a
# secret on one feature branch fails that branch's own runs and the pull request that contains it,
# and never an unrelated pull request or main. `all` scans every ref of the repository (all
# branches and tags) and is used only by scheduled runs, where a finding is an alert and gates
# nothing. Every branch is covered by both: its own push run (secret-scan-branches.yml) and the
# scheduled all-refs scan.
#
# Called from:
#   - .github/workflows/security.yml     (pull requests and pushes to main: `ref`; weekly schedule:
#                                         `all`, and a weekly `ref` scan of the `sync` branch)
#   - .github/workflows/secret-scan-branches.yml (pushes to any other branch: `ref`; daily: `all`)
#   - a stub that lives ONLY on the orphan `sync` branch and runs on every push to `sync`
#     (see docs/process/ci-cd.md, "The sync branch"). GitHub runs a push-triggered workflow
#     from the pushed branch, so a workflow file on `main` can never fire for pushes to
#     `sync`; the stub is a few lines that call this file.
#
# gitleaks is run as the official release binary, verified against the release's
# published checksums AND a digest pinned here. It is NOT gitleaks-action, which needs a
# paid licence for organisations. No secrets, read-only token.
name: Secret scan

on:
  workflow_call:
    inputs:
      ref:
        description: Branch to scan instead of the ref that triggered the caller (empty = the triggering ref).
        type: string
        required: false
        default: ""
      scope:
        description: "`ref` = commits reachable from the checked-out ref; `all` = every branch and tag."
        type: string
        required: false
        default: ref

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # To upgrade: take the new version and the linux_x64 tarball digest from
      #   gh api repos/gitleaks/gitleaks/releases/latest -q '.assets[] | .name + "  " + .digest'
      # and change both values in the same pull request.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # A scheduled scan of a branch that does not exist yet (for example `sync` before it is created) is a no-op.
      - name: Check that the branch to scan exists
        id: target
        shell: bash
        env:
          SCAN_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          exists=true
          if [ -n "$SCAN_REF" ]; then
            status=0
            git ls-remote --exit-code --heads "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$SCAN_REF" > /dev/null || status=$?
            case "$status" in
              0) ;;
              2)
                exists=false
                echo "::notice::Branch '$SCAN_REF' does not exist; nothing to scan."
                ;;
              *)
                echo "::error::Could not list branches of ${GITHUB_REPOSITORY} (git exit code $status)."
                exit 1
                ;;
            esac
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Check out repository (full history)
        if: steps.target.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Every scan uses the .gitleaks.toml of the default branch (main), never the one of the scanned
      # ref: a branch or pull request must not be able to loosen the rules or the allowlist that judge
      # its own commits (a change to the config takes effect only once it is reviewed and on main).
      # This also covers the orphan `sync` branch, which has no config of its own. It fails closed:
      # if main's config cannot be fetched or is empty, the job fails and nothing is scanned.
      # The same holds for `.gitleaksignore` (gitleaks reads one from the scanned directory by
      # default, so a branch could list a finding's fingerprint to hide it): main's file is passed
      # explicitly with --gitleaks-ignore-path, or an empty file when main has none.
      - name: Load the gitleaks config and ignore file from main
        if: steps.target.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          git show FETCH_HEAD:.gitleaks.toml > "${RUNNER_TEMP}/gitleaks-main.toml"
          if [ ! -s "${RUNNER_TEMP}/gitleaks-main.toml" ]; then
            echo "::error::The .gitleaks.toml of main is missing or empty; refusing to scan without it."
            exit 1
          fi
          echo "GITLEAKS_CONFIG=${RUNNER_TEMP}/gitleaks-main.toml" >> "$GITHUB_ENV"
          ignore="${RUNNER_TEMP}/gitleaksignore-main"
          if git cat-file -e FETCH_HEAD:.gitleaksignore 2> /dev/null; then
            git show FETCH_HEAD:.gitleaksignore > "$ignore"
          else
            : > "$ignore"
          fi
          echo "GITLEAKS_IGNORE=$ignore" >> "$GITHUB_ENV"

      - name: Install gitleaks (checksum-verified release binary)
        if: steps.target.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$tarball" "${base}/${tarball}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 --output "$checksums" "${base}/${checksums}"
          # 1. Verify against the checksums published with the release.
          grep -F " ${tarball}" "$checksums" | sha256sum --check --strict -
          # 2. Verify against the digest pinned in this repository, so a tampered
          #    release (tarball and checksum file together) is still rejected.
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      # `ref`: every commit reachable from the checked-out ref (`--log-opts=HEAD`). `all`: gitleaks'
      # default, every ref. Findings are redacted in the log. An allowlist, if ever needed, goes in
      # a reviewed .gitleaks.toml / .gitleaksignore on main (owner reviewed); the files of the scanned
      # ref are never read: main's are passed explicitly, and the working tree's .gitleaksignore is
      # deleted first (some gitleaks versions load it even when --gitleaks-ignore-path is set;
      # deleting it from the checkout does not change the history that is scanned).
      #
      # Negative control, first, with the same binary and the same arguments as the real scan: a
      # temporary repository with one synthetic secret (assembled at run time, so no literal secret
      # is in this repository) plus a permissive .gitleaks.toml and a .gitleaksignore that lists the
      # finding. The unprotected scan is reported (it shows whether the bypass is real); the
      # protected scan MUST find the secret (exit 1), or the job fails.
      - name: Scan git history for secrets
        if: steps.target.outputs.exists == 'true'
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          if [ -z "${GITLEAKS_CONFIG:-}" ]; then
            echo "::error::No gitleaks config was loaded from main."
            exit 1
          fi
          if [ -z "${GITLEAKS_IGNORE:-}" ]; then
            echo "::error::No gitleaks ignore file was loaded from main."
            exit 1
          fi

          # protected_scan <directory> [extra gitleaks arguments]: exactly the arguments of the real scan.
          protected_scan() {
            local dir="$1"
            shift
            rm -f "$dir/.gitleaksignore"
            gitleaks git --redact --no-banner --exit-code 1 --config "$GITLEAKS_CONFIG" --gitleaks-ignore-path "$GITLEAKS_IGNORE" "$@" "$dir"
          }

          control="${RUNNER_TEMP}/gitleaks-control"
          rm -rf "$control"
          mkdir -p "$control"
          git -C "$control" init --quiet
          # A well-known token shape, assembled from parts.
          secret="AKIA""QYLPMNTRXWHZKDSB"
          printf 'aws_access_key_id = %s\n' "$secret" > "$control/credentials.txt"
          git -C "$control" add credentials.txt
          git -C "$control" -c user.name=control -c user.email=control@example.invalid commit --quiet -m "control"

          # 1. Plain scan (default rules): the secret must be detected, and gives the fingerprint.
          report="${RUNNER_TEMP}/gitleaks-control.json"
          code=0
          gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path "$report" "$control" > /dev/null 2>&1 || code=$?
          if [ "$code" -ne 1 ]; then
            echo "::error::Negative control: the synthetic secret was not detected by a plain scan (exit $code)."
            exit 1
          fi
          fingerprint="$(jq -r '.[0].Fingerprint' "$report")"
          if [ -z "$fingerprint" ] || [ "$fingerprint" = "null" ]; then
            echo "::error::Negative control: no fingerprint in the report."
            exit 1
          fi

          # 2. The bypass attempt: a permissive config and an ignore file listing the finding.
          printf '%s\n' '[extend]' 'useDefault = true' '[[allowlists]]' "paths = ['''.*''']" > "$control/.gitleaks.toml"
          printf '%s\n' "$fingerprint" > "$control/.gitleaksignore"

          # 3. Unprotected scan (the way a branch's own files would apply): informational.
          code=0
          gitleaks git --no-banner --exit-code 1 "$control" > /dev/null 2>&1 || code=$?
          echo "Negative control, unprotected scan with the branch's own config and ignore file: exit $code (0 = the bypass is real)."

          # 4. Protected scan: must still find the secret.
          code=0
          protected_scan "$control" > /dev/null 2>&1 || code=$?
          echo "Negative control, protected scan: exit $code (must be 1)."
          if [ "$code" -ne 1 ]; then
            echo "::error::Negative control failed: the protected scan did not detect the secret hidden by a branch's own config and ignore file (exit $code)."
            exit 1
          fi

          args=(--verbose)
          case "$SCOPE" in
            ref) args+=(--log-opts=HEAD) ;;
            all) ;;
            *)
              echo "::error::Unknown scan scope (expected ref or all)."
              exit 1
              ;;
          esac
          protected_scan "$GITHUB_WORKSPACE" "${args[@]}"
