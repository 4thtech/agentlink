name: Install Playwright browsers
description: >-
  CHORE-CI-HARDEN-1, CHORE-CI-PLAYWRIGHT-2. Restores the Playwright browser downloads from a cache
  keyed by OS, exact Playwright version and browser list, downloads whatever is missing (no apt),
  and touches apt only when a browser needs a system library the runner lacks (bounded, one retry),
  so a slow Ubuntu mirror cannot hold a job. Needs Node and pnpm
  already set up (the repository's setup-node-pnpm action) and `playwright` as a root devDependency.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install.
    required: false
    default: chromium firefox webkit

runs:
  using: composite
  steps:
    # The version comes from the root package.json (exact pin), never from the network.
    - name: Resolve the Playwright version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version="$(jq -r '(.devDependencies.playwright // .devDependencies["@playwright/test"] // "")' package.json | sed 's/^[^0-9]*//')"
        if [ -z "$version" ]; then
          echo "::error::playwright is not a root devDependency; cannot key the browser cache."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Browser downloads only (no system packages). The key holds the version, the OS and the browser
    # list, so a new version or a different list gets a fresh download.
    - name: Cache the Playwright browsers
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.browsers }}

    # Browser binaries only (CDN download, no apt). On a cache hit this verifies and returns at once;
    # on a miss, or a partial cache, it downloads what is missing. Bounded, one retry.
    - name: Download the Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086 # BROWSERS is a fixed, space-separated list of browser names
        timeout 300 pnpm exec playwright install $BROWSERS || {
          echo "::warning::Playwright browser download failed once; retrying."
          timeout 300 pnpm exec playwright install $BROWSERS
        }

    # Linux only: launch each browser once through Playwright's own API (probe.mjs). Playwright
    # validates its host requirements (system libraries, bundled library paths) at launch, so the
    # answer is exactly the one the tests would get. Any failure or error counts as missing (fail
    # towards installing).
    - name: Check the browsers' system libraries
      id: libs
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PROBE: ${{ github.action_path }}/probe.mjs
      run: |
        set -uo pipefail
        missing=false
        if [ "$RUNNER_OS" = "Linux" ]; then
          if ! timeout 240 node "$PROBE"; then
            missing=true
          fi
        fi
        echo "missing=$missing" >> "$GITHUB_OUTPUT"

    # Only now apt. Short timeouts and retries: the CI failure was ~250 timeouts of 30 s from
    # azure.archive.ubuntu.com, one after another. The settings only apply to this runner.
    - name: Bound the apt network waits (Linux)
      if: runner.os == 'Linux' && steps.libs.outputs.missing == 'true'
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "10";' 'Acquire::https::Timeout "10";' \
          | sudo tee /etc/apt/apt.conf.d/99agentlink-ci-network > /dev/null

    - name: Install the Playwright system libraries (attempt 1)
      id: deps1
      if: runner.os == 'Linux' && steps.libs.outputs.missing == 'true'
      continue-on-error: true
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        timeout 300 pnpm exec playwright install-deps $BROWSERS

    - name: Install the Playwright system libraries (attempt 2)
      if: runner.os == 'Linux' && steps.libs.outputs.missing == 'true' && steps.deps1.outcome == 'failure'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        echo "::warning::Playwright system libraries failed once (slow or unreachable mirror); retrying."
        sudo apt-get update -o Acquire::Retries=3 || true
        # shellcheck disable=SC2086
        timeout 300 pnpm exec playwright install-deps $BROWSERS
