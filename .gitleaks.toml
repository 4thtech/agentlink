# gitleaks configuration. The default rules apply everywhere.
# The secret scan reads every branch of this public repository: anything pushed is public.
[extend]
useDefault = true

# Published cross-runtime test vectors (M0-9, M1-1h) contain test-only keys taken from RFCs, BIPs and
# NIPs or generated for tests (development-process.md §9.1). They are public by design and never real
# secrets. The allowlist covers only the vector data files, by exact path shape; generators, scripts
# and every other file stay scanned, and only the generic-api-key rule is relaxed there, so any other
# secret type in these files is still caught. The pinned upstream NIP-44 source vectors are included.
# Widening it is a reviewed change (sensitive path, audit-rules.md §2).
[[allowlists]]
description = "Public cross-runtime test vectors: test-only keys, never real secrets"
targetRules = ["generic-api-key"]
paths = [
  '''^test-vectors/[a-z0-9-]+/vectors\.json$''',
  '''^tools/vectors/sources/nip44\.vectors\.json$''',
]

# M1-3f (D-83): the OCC v2 ABI package carries public contract addresses (20-byte EVM addresses,
# published on chain and in the docs). gitleaks' generic-api-key rule matches the key name
# "AccessManager" ("access") next to an address. Only that rule is relaxed, only inside
# packages/occ-v2-abi/, and only when the matched value is exactly one 0x-prefixed 40-hex address
# (a 32-byte private key is 64 hex and stays caught). Widening it is a reviewed change.
[[allowlists]]
description = "Public OCC v2 contract addresses in the ABI package"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^packages/occ-v2-abi/''']
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
